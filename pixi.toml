[workspace]
authors = ["Benoit Guitard <benoit@familleguitard.fr>"]
channels = ["conda-forge"]
name = "fretwise"
platforms = ["win-64", "osx-arm64", "linux-64", "linux-aarch64", "osx-64"]
version = "0.5.0"

[environments]
default = []
dev = ["dev"]
train = ["train"]

[tasks]
web = { cmd = "fretwise web --port 8080", description = "Lance l'interface web FretWise" }
test = { cmd = "pytest -v", description = "Lancer les tests" }
# --- Bibliothèque de partitions (fretwise.partitions) ---
partitions-daily = { cmd = "python scripts/partitions_daily_sync.py", description = "Pipeline quotidien : move → rebuild → enrich → propose → archive" }
partitions-rebuild = { cmd = "python scripts/partitions_rebuild.py", description = "Régénère songs_index.tsv + liste_partitions.txt" }
partitions-move = { cmd = "python scripts/partitions_move_downloads.py", description = "Déplace les .gp de Downloads vers la bibliothèque (dédup)" }
partitions-propose = { cmd = "python scripts/partitions_propose.py", description = "Propose des morceaux + prompt Songsterr du jour" }
# --- Fiches gears (fretwise.gears.production) ---
gears-validate = { cmd = "python scripts/gears_validate.py", description = "Valide les fiches data/gears/*.json" }
gears-compact = { cmd = "python scripts/gears_compact.py", description = "Compacte les sorties verboses en schéma gear.v2" }
gears-supersede = { cmd = "python scripts/gears_supersede.py", description = "Fait des fiches gears la source unique (purge legacy)" }
# --- Dataset / entraînement doigtés (fretwise.dataset, env train) ---
dataset-eval = { cmd = "python scripts/dataset_eval_fretwise.py", description = "Évalue le pipeline fretwise contre le dataset annoté" }

[dependencies]
python = "3.11.*"
pebble = ">=5.2.0,<6"

[pypi-dependencies]
fretwise = { path = ".", editable = true }
pyguitarpro = ">=0.10"
music21 = ">=10.1.0, <11"
mido = ">=1.3.3, <2"
python-rtmidi = ">=1.5.4, <2"
pretty-midi = ">=0.2.11, <0.3"
numpy = ">=2.4.6, <3"
mirdata = ">=1.0.0, <2"
click = ">=8.4.0, <9"
reportlab = ">=4.5.1, <5"
pyyaml = ">=6.0.3, <7"
fastapi = ">=0.110"
uvicorn = { version = ">=0.29", extras = ["standard"] }
python-multipart = ">=0.0.9"
onnxruntime = ">=1.17"
pytest = ">=9.0.3, <10"
pytest-cov = ">=7.1.0, <8"
pymupdf = ">=1.27.2.3, <2"
authlib = ">=1.3"
itsdangerous = ">=2.0"
boto3 = ">=1.34"
httpx = ">=0.27"
google-api-python-client = ">=2.0"
google-auth = ">=2.0"
requests = ">=2.31"

[feature.train.pypi-dependencies]
xgboost = ">=2.0"
scikit-learn = ">=1.4"
onnx = ">=1.16"
onnxmltools = ">=1.12"
pandas = ">=2.0"
pyarrow = ">=15.0"
tqdm = ">=4.66"
beautifulsoup4 = ">=4.12"
lxml = ">=5.0"

[feature.dev.pypi-dependencies]
pytest = ">=7.0"
pytest-cov = "*"
ruff = "*"
mypy = "*"
