[workspace]
authors = ["Benoit Guitard <benoit@familleguitard.fr>"]
channels = ["conda-forge"]
name = "fretwise"
platforms = ["win-64", "osx-arm64", "linux-64", "linux-aarch64", "osx-64"]
version = "0.1.0"

[environments]
default = []
dev = ["dev"]

[tasks]
web = { cmd = "fretwise web --port 8080", description = "Lance l'interface web FretWise" }
test = { cmd = "pytest -v", description = "Lancer les tests" }

[dependencies]
python = "3.11.*"

[pypi-dependencies]
fretwise = { path = ".", editable = true }
pyguitarpro = ">=0.10"
music21 = ">=10.1.0, <11"
mido = ">=1.3.3, <2"
pretty-midi = ">=0.2.11, <0.3"
numpy = ">=2.4.6, <3"
mirdata = ">=1.0.0, <2"
click = ">=8.4.0, <9"
reportlab = ">=4.5.1, <5"
pyyaml = ">=6.0.3, <7"
fastapi = ">=0.110"
uvicorn = { version = ">=0.29", extras = ["standard"] }
python-multipart = ">=0.0.9"
onnxruntime = ">=1.17"
pytest = ">=9.0.3, <10"
pytest-cov = ">=7.1.0, <8"
pymupdf = ">=1.27.2.3, <2"

[feature.dev.pypi-dependencies]
pytest = ">=7.0"
pytest-cov = "*"
ruff = "*"
mypy = "*"
