# FretWise HTTPS endpoint on UGREEN's system nginx.
# Certificate is managed and renewed by UGOS for *.mblanche.direct.ug.link.
server {
    listen 80;
    listen [::]:80;
    server_name fretwise.mblanche.direct.ug.link;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fretwise.mblanche.direct.ug.link;

    ssl_certificate /ugreen/.config/ssl/certs/mblanche.direct.ug.link/cert.pem;
    ssl_certificate_key /ugreen/.config/ssl/certs/mblanche.direct.ug.link/privkey.pem;

    client_max_body_size 512m;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
