[Service]
# UGOS resets /etc/nginx from /rom during nginx startup. Restore FretWise's
# persistent server block afterwards, validate the complete config, then reload.
ExecStartPost=/usr/bin/install -o root -g root -m 0644 /volume2/docker/fretwise/proxy/fretwise-ugreen.conf /etc/nginx/server.d/fretwise.conf
ExecStartPost=/usr/sbin/nginx -t -q
ExecStartPost=/usr/sbin/nginx -s reload
