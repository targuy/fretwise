[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fretwise"
version = "0.4.0"
description = "Guitar Fingering Optimization System"
requires-python = ">=3.11"
dependencies = [
    "PyGuitarPro>=0.10",
    "music21",
    "mido",
    "pretty_midi",
    "numpy",
    "mirdata",
    "click",
    "reportlab",
    "PyYAML",
    "defusedxml>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "onnxruntime>=1.20",
]
# Cloud partitions storage backends (S3-compatible / WebDAV / Google Drive).
# Install only what you need; each backend imports its SDK lazily.
cloud = [
    "boto3>=1.34",                      # S3-compatible (AWS S3, MinIO, R2, B2…)
    "httpx>=0.27",                      # WebDAV / Nextcloud
    "google-api-python-client>=2.0",    # Google Drive
    "google-auth>=2.0",                 # Google Drive auth
]

[project.scripts]
fretwise = "fretwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fretwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/fretwise"]

[tool.coverage.report]
fail_under = 80
