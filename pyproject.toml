[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fretwise"
version = "0.5.0"
description = "Guitar Fingering Optimization System"
requires-python = ">=3.11"
dependencies = [
    "PyGuitarPro>=0.10",
    "music21",
    "mido",
    "python-rtmidi",
    "pretty_midi",
    "numpy",
    "mirdata",
    "click",
    "reportlab",
    "PyYAML",
    "defusedxml>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "pebble>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "onnxruntime>=1.20",
]
# Optional GPU stats panel for tools/finger_batch.py's dashboard (informational
# only — fingering computation never runs on GPU, see tools/finger_batch.py).
monitor = [
    "nvidia-ml-py>=12.0",
]
# Cloud partitions storage backends (S3-compatible / WebDAV / Google Drive).
# Install only what you need; each backend imports its SDK lazily.
cloud = [
    "boto3>=1.34",                      # S3-compatible (AWS S3, MinIO, R2, B2…)
    "httpx>=0.27",                      # WebDAV / Nextcloud
    "google-api-python-client>=2.0",    # Google Drive
    "google-auth>=2.0",                 # Google Drive auth
]
# Multi-user OIDC authentication + per-user encrypted credentials.
auth = [
    "authlib>=1.3",         # OIDC / OAuth2 client (Google + generic providers)
    "itsdangerous>=2.0",    # signed session cookies (Starlette SessionMiddleware)
    "cryptography>=42",     # encrypt per-user credentials at rest
]
# Bibliothèque de partitions (fretwise.partitions) : synchro Notion directe.
# Le reste du package est stdlib-only ; requests n'est requis que pour notion_sync.
partitions = [
    "requests>=2.31",
]
# Entraînement des modèles de doigtés (fretwise.dataset.pipeline) : XGBoost → ONNX.
# L'inférence (fretwise.ml) n'a besoin que du groupe `ml` (onnxruntime).
train = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "onnx>=1.16",
    "onnxmltools>=1.12",
    "pandas>=2.0",
    "pyarrow>=15.0",        # export Parquet (fretwise.dataset.exporters.parquet)
    "tqdm>=4.66",
    "requests>=2.31",       # scrapers / téléchargements de datasets
    "beautifulsoup4>=4.12", # fretwise.dataset.scrapers
    "lxml>=5.0",
]

[project.scripts]
fretwise = "fretwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fretwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Code d'entraînement porté depuis GuitarDataSet : grandes tables littérales
# (dictionnaires d'accords, features) où la limite de 100 colonnes nuirait
# à la lisibilité. Le code neuf hors tables doit rester ≤ 100 colonnes.
"src/fretwise/dataset/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/fretwise"]

[tool.coverage.report]
fail_under = 80
