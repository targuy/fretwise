<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — FretWise</title>
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <h1 class="auth-logo">🎸 FretWise</h1>
    <p class="auth-sub">Sign in to your account</p>

    <div id="banner" class="auth-banner" hidden></div>

    <!-- Primary: Google / OIDC sign-in (large). Shown when a provider is set. -->
    <div id="oidc" class="auth-oidc-primary" hidden>
      <div id="oidc-buttons" class="oidc-buttons oidc-buttons-large"></div>
    </div>

    <!-- Secondary: local accounts (small) — e.g. the env-configured admin. -->
    <section class="auth-local">
      <div class="auth-divider"><span>Local accounts</span></div>
      <form id="login-form" class="auth-form auth-form-compact" autocomplete="on">
        <label>Username
          <input type="text" name="email" required autocomplete="username" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn-secondary">Sign in</button>
      </form>

      <div id="resend-row" class="auth-resend" hidden>
        <button id="resend-btn" type="button" class="btn-link">Resend activation email</button>
      </div>

      <p class="auth-foot">No account? <a href="/register">Create one</a></p>
    </section>
  </main>
  <script src="/static/js/auth.js"></script>
  <script>FretwiseAuth.initLogin();</script>
</body>
</html>
