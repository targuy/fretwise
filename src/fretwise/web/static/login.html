<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — FretWise</title>
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <h1 class="auth-logo">🎸 FretWise</h1>
    <p class="auth-sub">Sign in to your account</p>

    <div id="banner" class="auth-banner" hidden></div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <label>Email
        <input type="email" name="email" required autocomplete="username" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div id="resend-row" class="auth-resend" hidden>
      <button id="resend-btn" type="button" class="btn-link">Resend activation email</button>
    </div>

    <div id="oidc" class="auth-oidc" hidden>
      <div class="auth-divider"><span>or</span></div>
      <div id="oidc-buttons" class="oidc-buttons"></div>
    </div>

    <p class="auth-foot">No account? <a href="/register">Create one</a></p>
  </main>
  <script src="/static/js/auth.js"></script>
  <script>FretwiseAuth.initLogin();</script>
</body>
</html>
