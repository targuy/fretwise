<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — FretWise</title>
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <h1 class="auth-logo">🎸 FretWise</h1>
    <p class="auth-sub">Create your account</p>

    <div id="banner" class="auth-banner" hidden></div>

    <form id="register-form" class="auth-form" autocomplete="on">
      <label>Email
        <input type="email" name="email" required autocomplete="username" />
      </label>
      <label>Password <span class="hint">(min. 8 characters)</span>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <div id="oidc" class="auth-oidc" hidden>
      <div class="auth-divider"><span>or</span></div>
      <a id="google-btn" class="btn-oidc" href="/auth/login/google" hidden>Sign up with Google</a>
    </div>

    <p class="auth-foot">Already registered? <a href="/login">Sign in</a></p>
  </main>
  <script src="/static/js/auth.js"></script>
  <script>FretwiseAuth.initRegister();</script>
</body>
</html>
