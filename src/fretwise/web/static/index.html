<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FretWise</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ═══════════════ HEADER BAR ═══════════════ -->
<header id="header">
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="28" height="28">
        <circle cx="16" cy="16" r="14" fill="#4caf50" stroke="#fff" stroke-width="1.5"/>
        <text x="16" y="21" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="Arial">F</text>
      </svg>
      <span class="logo-text">FretWise</span>
    </div>
  </div>
  <div class="header-center"></div>
  <div class="header-right"></div>
</header>

<!-- ═══════════════ FILE SELECTOR (shown initially) ═══════════════ -->
<div id="file-selector" class="panel">
  <h2>Select a score</h2>
  <div id="file-list" class="file-grid"></div>
  <div id="file-loading" class="loading" style="display:none">Loading files…</div>
  <div id="upload-area">
    <label id="upload-label" for="upload-input">&#8679; Upload a file (.gp3 .gp4 .gp5 .gp .xml .mid)</label>
    <input type="file" id="upload-input" accept=".gp3,.gp4,.gp5,.gp,.xml,.mxl,.musicxml,.mid,.midi" style="display:none">
    <span id="upload-status"></span>
  </div>
</div>

<!-- ═══════════════ TRACK SELECTOR (shown after file pick) ═══════════════ -->
<div id="track-selector" class="panel" style="display:none">
  <h2 id="track-title">Select a track</h2>
  <div id="track-list" class="track-grid"></div>
  <button class="btn-back" id="btn-back-files">&larr; Back to files</button>
</div>

<!-- ═══════════════ TAB VIEWER (main view) ═══════════════ -->
<div id="tab-viewer" style="display:none">
  <!-- Title block -->
  <div id="tab-header">
    <h1 id="song-title"></h1>
    <div id="song-artist"></div>
    <div id="song-meta">
      <span id="meta-instrument" class="badge"></span>
      <span id="meta-mode" class="badge badge-green"></span>
      <span id="meta-view-mode" class="badge badge-green"></span>
      <span id="meta-tempo"></span>
    </div>
  </div>

  <!-- Chord diagram strip -->
  <div id="chord-strip" style="display:none"></div>

  <!-- Position scrubber -->
  <div id="position-bar">
    <input type="range" id="position-scrubber" min="0" max="1000" value="0" title="Drag to seek">
  </div>

  <!-- Canvas tab area -->
  <div id="tab-container">
    <div id="core-svg-view" style="display:none; position:absolute; inset:0; overflow:auto; background:#fff; z-index:2; padding:8px 0;"></div>
    <canvas id="tab-canvas"></canvas>
    <canvas id="cursor-canvas"></canvas>
  </div>

  <!-- Legend toggle -->
  <button id="btn-legend" class="btn-legend">Legend</button>
</div>

<!-- ═══════════════ BOTTOM TOOLBAR ═══════════════ -->
<footer id="toolbar" style="display:none">
  <div class="toolbar-left">
    <select id="track-switcher" class="toolbar-select" title="Switch track / voice"></select>
    <span class="tb-sep"></span>
    <span class="tb-label">Mode</span>
    <select id="mode-select" class="toolbar-select" title="Fingering optimisation mode: affects cost weights (mechanical / musical / player profile). Changing re-computes the fingerings.">
      <option value="reference">Reference</option>
      <option value="performance">Performance</option>
      <option value="musical">Musical</option>
      <option value="learning">Learning</option>
    </select>
    <span class="tb-sep"></span>
    <span class="tb-label">View</span>
    <select id="representation-mode-select" class="toolbar-select" title="Notation representation mode: standard staff, tablature, or hybrid views. Changing re-runs the solver and updates the rendering.">
      <option value="standard_tablature" selected>Standard + Tab</option>
      <option value="standard">Standard</option>
      <option value="tablature_rhythm">Tab + Rhythm</option>
      <option value="tablature">Tab</option>
    </select>
  </div>
  <div class="toolbar-center">
    <button class="tb-btn" id="btn-prev" title="Previous measure">&#9664;&#9664;</button>
    <button class="tb-btn tb-play" id="btn-play" title="Play / Pause">&#9654;</button>
    <button class="tb-btn" id="btn-next" title="Next measure">&#9654;&#9654;</button>
    <span class="tb-sep"></span>
    <span class="tb-label">BPM</span>
    <input type="number" id="bpm-input" class="bpm-input" min="20" max="300" step="1" title="Playback tempo in BPM (original file tempo)">
    <span class="tb-sep"></span>
    <span class="tb-label">Speed</span>
    <select id="speed-select" class="toolbar-select">
      <option value="25">25%</option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100" selected>100%</option>
      <option value="125">125%</option>
    </select>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="btn-loop-a" title="Set loop start (A)">A</button>
    <button class="tb-btn" id="btn-loop-b" title="Set loop end (B)">B</button>
    <button class="tb-btn" id="btn-loop-clear" title="Clear loop">× Loop</button>
    <button class="tb-btn" id="btn-metronome" title="Metronome">🎵 Metro</button>
    <button class="tb-btn" id="btn-sound" title="Sound OFF — click to enable">🔇</button>
    <span class="tb-sep"></span>
    <span class="tb-label">Vol</span>
    <input type="range" id="rng-volume" min="0" max="100" value="70" class="rng-volume" title="Volume">
  </div>
  <div class="toolbar-right">
    <span class="tb-label">Engine</span>
    <select id="pdf-engine-select" class="toolbar-select" title="PDF export engine">
      <option value="core" selected>Core</option>
      <option value="legacy">Legacy</option>
    </select>
    <button class="tb-btn" id="btn-export-pdf" title="Export PDF">📄 PDF</button>
    <span id="pdf-export-status" class="tb-status" aria-live="polite"></span>
    <button class="tb-btn" id="btn-back-viewer">&larr; Back</button>
  </div>
</footer>

<!-- ═══════════════ LEGEND OVERLAY ═══════════════ -->
<div id="legend-overlay" class="overlay" style="display:none">
  <div class="overlay-content legend-overlay-content">
    <button class="overlay-close" id="legend-close">&times;</button>
    <h2 style="margin-bottom:4px">Guide — Notation de tablature guitare</h2>
    <p style="font-size:12px;color:#666;margin:0 0 16px">Guide lecteur FretWise. Cette page partage les mêmes noms de symboles que le PDF et les mêmes interprétations de base pour la tablature et le rythme.</p>
    <div id="legend-content" class="legend-body"></div>
  </div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
