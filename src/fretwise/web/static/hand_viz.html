/* ---------- Boot ---------------------------------------------------------- */
async function loadData() {
  try {
    const r = await fetch("hand_viz_data.json", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.frames && j.frames.length) return j;
    }
  } catch (e) { /* fallback */ }
  return EMBEDDED_DATA;
}

function formatHUD(data) {
  const m = data.meta || {};
  document.getElementById("hud-title").textContent  = m.title  || "FretWise";
  document.getElementById("hud-artist").textContent = m.artist || "";
  document.getElementById("hud-track").textContent  = m.track ? ("> " + m.track) : "";
  document.getElementById("hud-meta").textContent   =
    Math.round(m.tempo || 120) + " BPM - " + data.frames.length + " notes - " +
    (m.max_seconds || 10) + "s - " + HAND_MODEL_LABEL;
}

/* ---------- Runtime state (mutable, reassignable via postMessage) -------- */
let CURRENT_DATA         = null;  // current dataset
let CURRENT_SIM          = null;  // hand simulator bound to that data
let CURRENT_CHORD_GROUPS = [];    // pre-computed chord groups for current data
let CURRENT_TOTAL        = 10;    // current max_seconds
let playT                = 0;     // internal clock (standalone mode)
let playing              = true;
let EXT_SYNCED           = false; // true = parent drives the clock via `seek`
let extT                 = 0;     // last time received from parent
let NO_FINGERING         = false; // true = staff-only / empty track, show message

/* ---------- Milestone 5: optional 3D renderer (feature flag, OFF by default) -
   The 3D hand is a strictly additive, opt-in alternative to the SVG renderer
   above.  EVERYTHING ABOVE THIS LINE is the unchanged 2.5D path; the default
   experience never touches three.js.  The flag is read from (in priority order):
     1. URL param  ?hand3d=1      (explicit per-link opt-in / opt-out with =0)
     2. localStorage "fretwise.hand3d" === "1"
   Absence of any flag → false → SVG, unchanged.  three.js is only fetched when
   the flag is on, via a dynamic import() of ./js/hand3d.js (so the default path
   carries zero extra bytes).  If that import fails or WebGL is unavailable, we
   fall back to the SVG view — never a blank/broken panel. */
const HAND3D_STORAGE_KEY = "fretwise.hand3d";
function hand3dRequested() {
  try {
    const params = new URLSearchParams(window.location.search || "");
    if (params.has("hand3d")) {
      const v = params.get("hand3d");
      return v === "" || v === "1" || v === "true";   // ?hand3d, =1, =true → on
    }
  } catch (e) { /* no URL (srcdoc/test) → fall through to storage */ }
  try {
    if (window.localStorage &&
        window.localStorage.getItem(HAND3D_STORAGE_KEY) === "1") {
      return true;
    }
  } catch (e) { /* storage blocked → treated as off */ }
  return false;
}
function setHand3dFlag(on) {
  try {
    if (window.localStorage) {
      window.localStorage.setItem(HAND3D_STORAGE_KEY, on ? "1" : "0");
    }
  } catch (e) { /* ignore */ }
}

let HAND3D_ACTIVE   = false;  // true once the 3D renderer is live (SVG hidden)
let HAND3D_RENDERER = null;   // Hand3DRenderer instance, or null (→ SVG)
let HAND3D_MODULE   = null;   // cached imported module
let HAND3D_LOADING  = false;  // guard against concurrent enable() calls

/* Build the per-frame kinematic snapshot the 3D rig consumes.  This is derived
   ENTIRELY from the SHARED model: the same HandSimulator `sim`, the same
   solveFinger() IK, and the same geometry helpers the SVG path uses — we do NOT
   re-solve angles here, we just package the already-solved joints so hand3d.js
   can re-express them as 3D bones.  Keeping this the single producer guarantees
   the two renderers never diverge kinematically. */
function buildKinSnapshot(sim) {
  const fingers = {};
  for (const fname of FINGER_ORDER) {
    const mcp = sim.getMcpPos(fname);
    const fg  = sim.fingers[fname];
    const ik  = solveFinger(mcp.x, mcp.y, fg.tipX, fg.tipY, fname, fg.role);
    fingers[fname] = {
      ik,
      role:    fg.role,
      fret:    fg.fret,
      strings: fg.strings,
      width:   fingerPxWidth(fname, fg.fret),
    };
  }
  const idxMcp = sim.getMcpPos("index");
  const pnkMcp = sim.getMcpPos("pinky");
  const θ       = sim.wristRot;
  const nPalmX  = Math.sin(θ);
  const nPalmY  = -Math.cos(θ);
  const palmTopX = sim.palmX + nPalmX * PALM_TOP_FROM_MCP;
  const palmTopY = sim.pivotY + nPalmY * PALM_TOP_FROM_MCP;
  return {
    fingers,
    palm: {
      mcpL: idxMcp.x - 10,
      mcpR: pnkMcp.x + 10,
      topX: palmTopX,
      topY: palmTopY,
      botY: sim.pivotY + 12,
    },
    forearm: {
      wristX:   palmTopX + sim.forearmDrift * 0.3,
      forearmX: palmTopX + sim.forearmDrift,
      topY:     FOREARM_TOP_Y,
    },
    thumb: { x: sim.thumb.x, y: sim.thumb.y, role: sim.thumb.role },
  };
}

/* Geometry snapshot for the 3D board — same helpers/constants as the SVG path
   so the 3D fretboard shares one coordinate space with the hand. */
function hand3dGeometry() {
  return {
    NUT_X,
    fretX,
    stringY,
    stringTop:    STRING_Y_TOP,
    stringBottom: STRING_Y_BOTTOM,
    numFrets:     NUM_FRETS,
    numStrings:   NUM_STRINGS,
  };
}

/* Enable the 3D renderer: dynamically import three.js + the rig, create the
   renderer, and on success hide the SVG and show the 3D canvas.  On ANY failure
   (import error, WebGL unavailable, construction throw) we stay on SVG and
   surface a small note — never a broken panel.  Returns true on success. */
async function enableHand3d() {
  if (HAND3D_ACTIVE || HAND3D_LOADING) return HAND3D_ACTIVE;
  HAND3D_LOADING = true;
  const mount = document.getElementById("scene3d");
  const svg   = document.getElementById("scene");
  try {
    if (!HAND3D_MODULE) {
      HAND3D_MODULE = await import("./js/hand3d.js");
    }
    const renderer = HAND3D_MODULE.create(mount);
    if (!renderer) throw new Error("WebGL unavailable or renderer creation failed");
    HAND3D_RENDERER = renderer;
    HAND3D_ACTIVE   = true;
    renderer.setGeometry(hand3dGeometry());
    if (mount) mount.style.display = "block";
    if (svg)   svg.style.display   = "none";
    _syncHand3dButton();
    return true;
  } catch (e) {
    // Fall back to SVG cleanly.
    HAND3D_RENDERER = null;
    HAND3D_ACTIVE   = false;
    if (mount) mount.style.display = "none";
    if (svg)   svg.style.display   = "block";
    _syncHand3dButton();
    return false;
  } finally {
    HAND3D_LOADING = false;
  }
}

/* Disable the 3D renderer and restore the unchanged SVG view. */
function disableHand3d() {
  if (HAND3D_RENDERER) {
    try { HAND3D_RENDERER.dispose(); } catch (e) { /* ignore */ }
  }
  HAND3D_RENDERER = null;
  HAND3D_ACTIVE   = false;
  const mount = document.getElementById("scene3d");
  const svg   = document.getElementById("scene");
  if (mount) mount.style.display = "none";
  if (svg)   svg.style.display   = "block";
  _syncHand3dButton();
}

function _syncHand3dButton() {
  const btn = document.getElementById("btn-3d");
  if (btn) btn.textContent = HAND3D_ACTIVE ? "3D : on" : "3D : off";
}

/* A payload has no playable fingering when it has zero frames or every frame is
   an open string / fingerless.  Such tracks (vocal, staff-only, a solve that
   produced no fretted notes) must degrade gracefully rather than render a
   broken hand or fall through to the embedded demo. */
function _hasNoFingering(data) {
  const frames = (data && Array.isArray(data.frames)) ? data.frames : [];
  if (data && data.meta && data.meta.fingered === false) return true;
  if (!frames.length) return true;
  return !frames.some((f) =>
    f && f.finger && f.finger !== "open" && typeof f.fret === "number" && f.fret > 0);
}

function installData(data) {
  CURRENT_DATA         = data;
  NO_FINGERING         = _hasNoFingering(data);
  // Derive fret/string/tuning/scale/capo geometry from the payload BEFORE the
  // simulator is built — HandSimulator's constructor reads pressX()/stringY(),
  // which depend on the configured geometry.
  configureGeometry(data);
  CURRENT_SIM          = new HandSimulator();
  CURRENT_CHORD_GROUPS = (data && data.frames) ? buildChordGroups(data.frames) : [];
  CURRENT_TOTAL        = (data && data.meta && data.meta.max_seconds) || 10;
  playT                = 0;
  EXT_SYNCED           = !!(data && data.meta && data.meta.synced);
  formatHUD(data);
  buildFretboard(document.getElementById("layer-fretboard"), data);
  // Clear any hand drawn for a previous (fingered) track and show/hide the
  // graceful empty-state message.
  renderNoFingeringState();
  // If the 3D renderer is live, refresh its fretboard for the new track's
  // geometry (string count / fret span can change between tracks).  The SVG
  // path is geometry-rebuilt by buildFretboard() above; mirror that for 3D.
  if (HAND3D_ACTIVE && HAND3D_RENDERER) {
    try { HAND3D_RENDERER.setGeometry(hand3dGeometry()); } catch (e) { /* keep SVG-safe */ }
  }
}

/* Show or clear the "no fingering for this track" state.  When active we wipe
   the hand/shadow/overlay layers (so no stale or broken hand lingers) and draw a
   centred message; the per-frame loop also early-outs while NO_FINGERING. */
function renderNoFingeringState() {
  const layerHand    = document.getElementById("layer-hand");
  const layerShadow  = document.getElementById("layer-shadow");
  const layerOverlay = document.getElementById("layer-overlay");
  if (layerHand)    clearLayer(layerHand);
  if (layerShadow)  clearLayer(layerShadow);
  if (layerOverlay) clearLayer(layerOverlay);
  const logEl = document.getElementById("notelog");
  if (!NO_FINGERING) {
    if (logEl) logEl.textContent = "-";
    return;
  }
  if (!layerOverlay) return;
  const cx = SCENE_W / 2;
  const cy = SCENE_H / 2;
  const g = el("g", { id: "no-fingering-msg", "text-anchor": "middle" });
  g.appendChild(el("text", {
    x: cx, y: cy - 6,
    "font-family": "Helvetica, Arial, sans-serif",
    "font-size": 26, "font-weight": 800, fill: "#c6cad1",
  }, "Aucun doigté pour cette piste"));
  g.appendChild(el("text", {
    x: cx, y: cy + 26,
    "font-family": "Helvetica, Arial, sans-serif",
    "font-size": 15, "font-weight": 500, fill: "#8d929a",
  }, "No fingering for this track (vocal / staff only)"));
  layerOverlay.appendChild(g);
  if (logEl) logEl.textContent = "Aucun doigté pour cette piste.";
}

/* postMessage support — the parent FretWise UI pushes fingering data
   ("fretwise-hand-data") and time updates ("fretwise-hand-seek") here. */
window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (!msg) return;
  if (msg.type === "fretwise-hand-data"
      && msg.payload && Array.isArray(msg.payload.frames)) {
    installData(msg.payload);
  } else if (msg.type === "fretwise-hand-seek") {
    extT    = typeof msg.t === "number" ? msg.t : 0;
    playing = !!msg.playing;
    EXT_SYNCED = true;
  }
});

/* 3D toggle (Milestone 5).  Clicking flips the persisted flag and swaps
   renderers cleanly.  Default stays SVG; the 3D path is purely opt-in.

   This is wired at TOP LEVEL (not inside the async data-load IIFE below) on
   purpose: the script tag sits at the end of <body>, so #btn-3d already exists,
   and binding here means the toggle is reachable the instant the page parses —
   independent of whether loadData()/installData() succeed.  Previously this
   binding lived after `installData(await loadData())`, so any throw while
   installing data left the visible "3D : off" button dead (clicks did nothing),
   which is exactly the "I can't reach 3D mode" symptom.  The boot-time flag
   honouring is likewise hoisted so a saved/URL opt-in still applies on first
   paint. */
(function wireHand3dToggle() {
  const btn3d = document.getElementById("btn-3d");
  if (btn3d) {
    _syncHand3dButton();
    btn3d.addEventListener("click", async () => {
      if (HAND3D_ACTIVE) {
        setHand3dFlag(false);
        disableHand3d();
      } else {
        setHand3dFlag(true);
        await enableHand3d();   // falls back to SVG on failure (button stays "off")
      }
    });
  }

  /* Honour an OFF-by-default flag from the URL / localStorage at boot.  Absence
     of the flag leaves the SVG renderer in place, unchanged. */
  if (hand3dRequested()) {
    enableHand3d();   // async; SVG keeps rendering until/unless it succeeds
  }
})();

(async () => {
  installData(await loadData());

  /* Tell the parent window we are ready to receive data via postMessage. */
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "fretwise-hand-ready" }, "*");
    }
  } catch (e) { /* isolated window */ }

  const layerShadow  = document.getElementById("layer-shadow");
  const layerHand    = document.getElementById("layer-hand");
  const layerOverlay = document.getElementById("layer-overlay");
  const tlFill       = document.getElementById("timeline-fill");
  const logEl        = document.getElementById("notelog");
  const btnPlay      = document.getElementById("btn-play");
  const btnRew       = document.getElementById("btn-rewind");

  /* Overlay: open-string rings + chord name flash. */
  function drawOverlay(state, tNow, chordGroups) {
    clearLayer(layerOverlay);

    // ── Open string pulse rings ──────────────────────────────────────────
    for (const s of state.openStrings) {
      const cy = stringY(s);
      const cx = NUT_X - 26;
      const onset = state.openRecent[s] || 0;
      const since = tNow - onset;
      if (since >= 0 && since < 0.22) {
        const k = 1 - since / 0.22;
        layerOverlay.appendChild(el("circle", {
          cx, cy, r: 13 + 10 * (1 - k),
          fill: "none",
          stroke: `rgba(255,204,60,${0.75 * k})`,
          "stroke-width": 2.2,
        }));
      }
      layerOverlay.appendChild(el("circle", {
        cx, cy, r: 11,
        fill: "rgba(255,204,60,0.22)",
        stroke: "#ffcc3c",
        "stroke-width": 1.8,
      }));
    }

    // ── Chord name flash ─────────────────────────────────────────────────
    if (!chordGroups || !chordGroups.length) return;
    let cg = null;
    for (let k = chordGroups.length - 1; k >= 0; k--) {
      if (chordGroups[k].startSec <= tNow) { cg = chordGroups[k]; break; }
    }
    if (!cg || !cg.chordName) return;

    const SHOW_DUR = 2.2;          // total display window (seconds)
    const FADE_IN  = 0.12;         // fade-in duration
    const ZOOM_DUR = 0.22;         // zoom-back duration (1.4 → 1.0)
    const HOLD_END = 1.8;          // start of fade-out
    const elapsed  = tNow - cg.startSec;
    if (elapsed < 0 || elapsed > SHOW_DUR) return;

    const fadeIn  = Math.min(1, elapsed / FADE_IN);
    const fadeOut = elapsed > HOLD_END
      ? Math.max(0, 1 - (elapsed - HOLD_END) / (SHOW_DUR - HOLD_END))
      : 1;
    const alpha = fadeIn * fadeOut;
    const scale = 1 + 0.4 * Math.max(0, 1 - elapsed / ZOOM_DUR);

    // Centre the label above the hand (palm top ≈ y=50; keep label in y 0–46).
    const cx = (NUT_X + fretX(NUM_FRETS)) / 2;
    const cy = 24;   // baseline of first line — keeps both lines above the palm

    const frName = chordNameFrench(cg.chordName);

    const g = el("g", {
      transform: `translate(${cx},${cy}) scale(${scale.toFixed(3)})`,
      opacity: alpha.toFixed(3),
    });
    // ── Anglo name (line 1) ─────────────────────────────────────────────
    // Dark halo for contrast against any background.
    g.appendChild(el("text", {
      x: 0, y: 0, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif",
      "font-size": 40, "font-weight": 800,
      fill: "rgba(20,12,0,0.55)",
      stroke: "rgba(20,12,0,0.55)", "stroke-width": "10",
      "stroke-linejoin": "round",
    }, cg.chordName));
    g.appendChild(el("text", {
      x: 0, y: 0, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif",
      "font-size": 40, "font-weight": 800,
      fill: "#f4a03a",
    }, cg.chordName));
    // ── French name (line 2) ────────────────────────────────────────────
    g.appendChild(el("text", {
      x: 0, y: 27, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif",
      "font-size": 26, "font-weight": 700,
      fill: "rgba(20,12,0,0.55)",
      stroke: "rgba(20,12,0,0.55)", "stroke-width": "7",
      "stroke-linejoin": "round",
    }, frName));
    g.appendChild(el("text", {
      x: 0, y: 27, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif",
      "font-size": 26, "font-weight": 700,
      fill: "#f4c070",
    }, frName));
    layerOverlay.appendChild(g);
  }

  function setPlay(p) {
    playing = p;
    btnPlay.textContent = p ? "Pause" : "Lecture";
  }
  setPlay(true);
  btnPlay.addEventListener("click", () => setPlay(!playing));
  btnRew .addEventListener("click", () => { playT = 0; });

  let lastMs = performance.now();
  function frame(now) {
    const dtMs = now - lastMs; lastMs = now;
    const dt   = Math.min(0.1, dtMs / 1000);

    /* Clock selection:
       - External (synced) mode: parent drives the clock via seek messages.
         We just read `extT` every frame; no internal accumulation, no loop.
         INVARIANT (sync-drift guard): each `fretwise-hand-seek` carries an
         ABSOLUTE timestamp (parent's playback.getCurrentTimeSec()), and we never
         integrate `dt` here — so tNow always equals the parent's clock exactly,
         with zero accumulated error no matter how long the piece runs.  Do NOT
         change this to `extT += dt` or any incremental form; that would
         reintroduce drift over a multi-minute timeline (regression-tested).
       - Standalone mode: internal loop (pre-existing behaviour).  */
    let tNow;
    if (EXT_SYNCED) {
      tNow = extT;
    } else {
      if (playing && CURRENT_DATA) {
        playT += dt;
        if (playT > CURRENT_TOTAL + 0.8) playT = 0;
      }
      tNow = playT;
    }

    // Staff-only / empty-fingering track: the graceful message is already
    // drawn by renderNoFingeringState(); skip all hand simulation/drawing so
    // nothing broken or stale appears, but keep the rAF loop alive so a later
    // track switch (postMessage) re-enables rendering.
    if (NO_FINGERING) {
      // The graceful "no fingering" message lives in the SVG overlay layer, so
      // it must be visible even if the 3D flag is on.  Reveal the SVG and hide
      // the 3D canvas for this state; the renderer swaps back when a fingered
      // track loads.
      if (HAND3D_ACTIVE) {
        const m = document.getElementById("scene3d");
        const sv = document.getElementById("scene");
        if (m)  m.style.display  = "none";
        if (sv) sv.style.display = "block";
      }
      tlFill.style.width = (100 * Math.min(1, tNow / Math.max(1, CURRENT_TOTAL))) + "%";
      requestAnimationFrame(frame);
      return;
    }
    // Leaving NO_FINGERING with 3D active: restore the 3D canvas / hide SVG.
    if (HAND3D_ACTIVE) {
      const m = document.getElementById("scene3d");
      const sv = document.getElementById("scene");
      if (m && m.style.display === "none")  m.style.display  = "block";
      if (sv && sv.style.display !== "none") sv.style.display = "none";
    }

    if (CURRENT_SIM && CURRENT_DATA) {
      const st = sampleState(tNow, CURRENT_DATA.frames);
      /* Only animate the hand when playing; freeze in place on pause so
         the user can inspect/screenshot the current finger positions. */
      if (playing) {
        CURRENT_SIM.update(tNow, dt, CURRENT_DATA.frames, CURRENT_CHORD_GROUPS);
      }
      // Renderer selection: when the 3D flag is on AND the renderer is live, the
      // SAME simulator state drives the 3D rig (via the shared kin snapshot) and
      // we skip the SVG hand draw.  Otherwise the unchanged SVG path runs.  Both
      // read the identical `CURRENT_SIM` updated above, so the time-sync (M4) and
      // kinematics are shared with zero divergence.
      if (HAND3D_ACTIVE && HAND3D_RENDERER) {
        try {
          HAND3D_RENDERER.update(buildKinSnapshot(CURRENT_SIM));
        } catch (e) {
          // A render fault must never blank the panel: fall back to SVG.
          disableHand3d();
          drawHand(layerHand, layerShadow, CURRENT_SIM, tNow);
        }
      } else {
        drawHand(layerHand, layerShadow, CURRENT_SIM, tNow);
      }
      drawOverlay(st, tNow, CURRENT_CHORD_GROUPS);

      tlFill.style.width = (100 * Math.min(1, tNow / Math.max(1, CURRENT_TOTAL))) + "%";
      const actParts = [], pltParts = [], hoverParts = [];
      for (const f of FINGER_ORDER) {
        const a = st.active[f];
        if (a) actParts.push(FINGER_LABEL[f] + ": S" + a.string + " F" + a.fret);
        const p = st.planted[f];
        if (p) pltParts.push(FINGER_LABEL[f] + ": S" + p.string + " F" + p.fret);
        const h = st.upcoming[f];
        if (h) hoverParts.push(FINGER_LABEL[f] + ": S" + h.string + " F" + h.fret);
      }
      const openList = [...st.openStrings].sort((a,b) => a - b)
        .map(s => "S" + s).join(" ");
      logEl.textContent = "t=" + tNow.toFixed(2) + "s - pos=" + st.handPos +
                           "   actifs: " + (actParts.join("  ") || "-") +
                           "   sedentaires: " + (pltParts.join("  ") || "-") +
                           "   prets: " + (hoverParts.join("  ") || "-") +
                           "   cordes a vide: " + (openList || "-");
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
