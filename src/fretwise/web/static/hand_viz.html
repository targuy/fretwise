<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FretWise — Main 3D</title>
  <style>
    :root { color-scheme: dark; --bg: #111517; --panel: rgba(12, 16, 18, .82); --text: #dce3df; --muted: #a4aaa6; --accent: #f4a03a; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, "Segoe UI", sans-serif; }
    #scene3d { position: fixed; inset: 0; background: #1b2725; }
    #controls { position: fixed; z-index: 2; top: 10px; right: 12px; display: flex; gap: 8px; }
    button { border: 1px solid #47504d; border-radius: 6px; padding: 6px 10px; background: var(--panel); color: var(--text); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #hand-status { position: fixed; z-index: 2; left: 12px; right: 12px; bottom: 10px; min-height: 18px; color: var(--muted); font-size: 12px; pointer-events: none; }
    #hand-status[data-level="error"] { color: #ffb4a4; }
    #scene3d[data-unavailable="true"]::after { content: "Main 3D indisponible"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); font-size: 18px; }
  </style>
</head>
<body>
  <main id="scene3d" aria-label="Visualisation main gauche 3D"></main>
  <nav id="controls" aria-label="Caméra de la main 3D">
    <button id="btn-cam-view" type="button">Vue : doigts</button>
    <button id="btn-top-view" type="button" aria-pressed="false">Vue dessus</button>
  </nav>
  <p id="hand-status" role="status">Main 3D : attente des données de la partition.</p>

  <script type="module">
    import { HAND_PROTOCOL_VERSION, HandTransportReceiver } from './js/hand_transport.js';
    import { create } from './js/hand_v2.js';

    const mount = document.getElementById('scene3d');
    const statusEl = document.getElementById('hand-status');
    const HAND_TRANSPORT = new HandTransportReceiver(location.origin, window.parent);
    const LEGACY_TUNING = ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'];
    const LEGACY_NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    let renderer = null;
    let currentPerformance = null;
    let loadRevision = 0;
    let playbackRate = 1;
    let camera = 'fingers';
    let perspectiveCamera = 'fingers';
    let baseStatus = 'Main 3D : attente des données de la partition.';

    function handStatus(message, level = 'info') {
      baseStatus = message;
      statusEl.textContent = message;
      statusEl.dataset.level = level;
    }

    function legacyMidi(value, fallback) {
      if (Number.isFinite(value)) return Number(value);
      const match = /^([A-G])([#b]?)(-?\d+)$/.exec(String(value || ''));
      if (!match) return fallback;
      const accidental = match[2] === '#' ? 1 : match[2] === 'b' ? -1 : 0;
      return LEGACY_NOTE_BASE[match[1]] + accidental + (Number(match[3]) + 1) * 12;
    }

    function legacyFinger(value) {
      const finger = String(value || 'open').replace(/^Finger\./, '').toLowerCase();
      return ['index', 'middle', 'ring', 'pinky', 'open'].includes(finger) ? finger : 'open';
    }

    // Historical payloads still use frames. Adapt data only; never revive their SVG renderer.
    function adaptLegacyFrames(data) {
      if (!data || !Array.isArray(data.frames)) return null;
      const fretboard = data.fretboard || {};
      const tempo = Math.max(1, Number(data.meta?.tempo) || 120);
      const ppq = 960;
      const tickAt = (seconds) => Math.max(0, Math.round((Number(seconds) || 0) * tempo * ppq / 60));
      const tuning = Array.isArray(fretboard.tuning) && fretboard.tuning.length === 6
        ? fretboard.tuning : LEGACY_TUNING;
      const capoFret = Math.max(0, Number.parseInt(fretboard.capo, 10) || 0);
      const fretCount = Math.min(24, Math.max(capoFret, Number.parseInt(fretboard.num_frets, 10) || 22));
      const notes = data.frames.map((frame, index) => {
        const finger = legacyFinger(frame?.finger);
        const stringNo = Math.min(6, Math.max(1, Number.parseInt(frame?.string, 10) || 1));
        const fretAbs = Math.min(fretCount, Math.max(capoFret, Number.parseInt(frame?.fret, 10) || capoFret));
        const onTick = tickAt(frame?.onset_sec);
        const soundEndTick = Math.max(onTick, tickAt((Number(frame?.onset_sec) || 0) + Math.max(0, Number(frame?.duration_sec) || 0)));
        const occurrenceId = `legacy-${frame?.note_id ?? index}`;
        return {
          occurrenceId, sourceNoteId: occurrenceId, voiceId: 'legacy', onTick,
          notatedEndTick: soundEndTick, soundEndTick,
          basePitchMidi: legacyMidi(tuning[6 - stringNo], 40) + fretAbs, velocity: 80, expressionIds: [],
          fingering: { finger: fretAbs === capoFret ? 'open' : finger, stringNo, fretAbs,
            handPositionHint: Number(frame?.hand_position) || undefined, provenance: 'legacy', locked: false },
        };
      });
      const endTick = Math.max(ppq, ...notes.map((note) => note.soundEndTick));
      return {
        schemaVersion: '1.0', scoreId: 'legacy-frames', trackId: 'legacy', scoreRevision: 'legacy', fingeringRevision: 'legacy', ppq,
        range: { startTick: 0, endTick }, tempoMap: [{ tick: 0, usPerQuarter: Math.round(60000000 / tempo) }],
        hand: { side: 'left', profileId: 'adult-reference-left', profileRevision: '1' },
        instrument: { profileId: 'six-string-648', profileRevision: '1', scaleLengthM: Math.max(.5, Number(fretboard.scale_length_mm) / 1000 || .648), fretCount, capoFret,
          strings: [...tuning].reverse().map((pitch, index) => ({ number: index + 1, openPitchMidi: legacyMidi(pitch, 64 - index * 5) })) },
        notes, expressions: [], holds: [], barres: [],
        diagnostics: [{ code: 'LEGACY_FRAMES_ADAPTED', severity: 'info', message: 'Données historiques adaptées au contrat de main v2.', noteIds: notes.map((note) => note.occurrenceId) }],
      };
    }

    function handPerformanceFor(data) {
      return data?.handPerformance && Array.isArray(data.handPerformance.notes)
        ? data.handPerformance : adaptLegacyFrames(data);
    }

    function hasNoFingering(data, performanceData) {
      if (data?.meta?.fingered === false) return true;
      const notes = performanceData?.notes || [];
      return !notes.some((note) => note?.fingering?.finger !== 'open' && note?.fingering?.fretAbs > 0);
    }

    async function installData(data) {
      const revision = ++loadRevision;
      if (!renderer) {
        handStatus('Main 3D indisponible sur cet appareil.', 'error');
        return;
      }
      if (data?.meta?.empty_reason === 'loading' || data?.meta?.empty_reason === 'load-failed') {
        currentPerformance = null;
        renderer.clearPerformance('');
        handStatus(data.meta.empty_reason === 'loading'
          ? 'Main 3D : chargement de la partition…'
          : 'Main 3D indisponible : la partition ne répond pas. Réessayez d’ouvrir la piste.',
        data.meta.empty_reason === 'loading' ? 'info' : 'error');
        return;
      }
      const performanceData = handPerformanceFor(data);
      currentPerformance = performanceData;
      if (!performanceData || hasNoFingering(data, performanceData)) {
        renderer.clearPerformance('Aucun doigté pour cette piste');
        handStatus('Aucun doigté pour cette piste.');
        return;
      }
      handStatus('Main 3D : préparation des mouvements…');
      try {
        await renderer.setPerformance(performanceData);
        if (revision !== loadRevision) return;
        await renderer.setPlaybackRate(playbackRate);
        if (revision !== loadRevision) return;
        renderer.setCameraView(camera);
        const diagnostics = renderer.getDiagnostics();
        handStatus(`Main v2 · maquette intégrée${diagnostics.length ? ` · ${diagnostics.length} diagnostic(s)` : ''}`);
      } catch (error) {
        if (revision !== loadRevision) return;
        renderer.clearPerformance('Main 3D indisponible');
        handStatus(`Main 3D indisponible : ${error.message}`, 'error');
      }
    }

    async function updatePlaybackRate(rate) {
      if (!Number.isFinite(rate) || rate <= 0 || rate === playbackRate) return;
      playbackRate = rate;
      if (!renderer || !currentPerformance) return;
      try { await renderer.setPlaybackRate(playbackRate); }
      catch (error) { handStatus(`Main 3D indisponible : ${error.message}`, 'error'); }
    }

    function syncCameraControls() {
      const names = { fingers: 'doigts', thumb: 'pouce', palm: 'paume', profile: 'profil', top: 'dessus' };
      const top = camera === 'top';
      document.getElementById('btn-cam-view').textContent = `Vue : ${names[camera] || camera}`;
      document.getElementById('btn-top-view').textContent = top ? 'Vue 3D' : 'Vue dessus';
      document.getElementById('btn-top-view').setAttribute('aria-pressed', String(top));
    }

    document.getElementById('btn-cam-view').addEventListener('click', () => {
      const views = ['fingers', 'thumb', 'palm', 'profile'];
      camera = views[((camera === 'top' ? -1 : views.indexOf(camera)) + 1) % views.length];
      perspectiveCamera = camera;
      renderer?.setCameraView(camera);
      syncCameraControls();
    });
    document.getElementById('btn-top-view').addEventListener('click', () => {
      if (camera === 'top') camera = perspectiveCamera;
      else { perspectiveCamera = camera; camera = 'top'; }
      renderer?.setCameraView(camera);
      syncCameraControls();
    });
    syncCameraControls();

    window.addEventListener('message', (event) => {
      const accepted = HAND_TRANSPORT.accept(event);
      if (!accepted) return;
      if (accepted.type === 'fretwise:load') {
        void installData(accepted.payload);
        window.parent.postMessage({ type: 'fretwise:loaded', protocolVersion: HAND_PROTOCOL_VERSION,
          sessionId: accepted.sessionId, planId: accepted.planId }, location.origin);
      } else if (accepted.type === 'fretwise:transport') {
        void updatePlaybackRate(accepted.rate);
      }
    });

    function renderTransportFrame() {
      const now = performance.timeOrigin + performance.now();
      const scoreSec = HAND_TRANSPORT.timeAt(now);
      renderer?.renderAt(scoreSec);
      statusEl.textContent = HAND_TRANSPORT.isDesynced(now) ? `TRANSPORT_DESYNC · ${baseStatus}` : baseStatus;
      requestAnimationFrame(renderTransportFrame);
    }

    try {
      renderer = create(mount);
      if (!renderer) throw new Error('WebGL unavailable');
      handStatus('Main 3D : attente des données de la partition.');
    } catch (error) {
      mount.dataset.unavailable = 'true';
      handStatus(`Main 3D indisponible : ${error.message}`, 'error');
    }
    window.parent.postMessage({ type: 'fretwise:ready', protocolVersion: HAND_PROTOCOL_VERSION }, location.origin);
    requestAnimationFrame(renderTransportFrame);
  </script>
</body>
</html>
