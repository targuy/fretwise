<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FretWise — Visualisation des doigtés</title>
  <style>
    :root {
      --bg-outer: #141518;
      --text: #d6d8db;
      --muted: #8d929a;
      --accent: #f4a03a;
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, #23262b 0%, var(--bg-outer) 100%);
      color: var(--text);
    }
    #app { max-width: 1440px; margin: 0 auto; padding: 12px 16px 16px; }
    #hud {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 4px 4px 10px;
    }
    #hud .title { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
    #hud .artist { color: var(--muted); font-size: 14px; }
    #hud .meta { color: var(--muted); font-size: 13px; }
    #hud .spacer { flex: 1; }
    button.ctrl {
      background: #2c2f34; color: var(--text);
      border: 1px solid #3b3e44; border-radius: 6px;
      font-size: 14px; padding: 6px 14px; cursor: pointer;
    }
    button.ctrl:hover { background: #363a41; }
    button.ctrl.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
    #scene-wrap {
      background: linear-gradient(180deg, #1a1c20 0%, #0f1013 100%);
      border-radius: 10px; padding: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45), inset 0 0 0 1px #2a2c31;
    }
    svg#scene { width: 100%; height: auto; display: block; }
    #timeline {
      margin-top: 14px; height: 10px; background: #1f2126;
      border-radius: 5px; overflow: hidden; position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }
    #timeline .fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), #f5c46b);
      width: 0%; transition: width 60ms linear;
    }
    #notelog {
      margin-top: 12px; font-family: "SF Mono", Consolas, monospace;
      font-size: 12px; color: var(--muted); height: 20px;
    }
    #legend {
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      margin-top: 10px; font-size: 12px; color: var(--muted);
    }
    #legend .swatch { display: inline-block; width: 14px; height: 14px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    #legend .active  { background: #e2b694; box-shadow: 0 0 6px rgba(226,182,148,0.55); }
    #legend .planted { background: #8de5ff; box-shadow: 0 0 6px rgba(114,220,255,0.45); }
    #legend .hover   { background: #ff8d80; border: 1px solid #ff756b; }
    #legend .idle    { background: #ff9b3d; border: 1px solid #ff9b3d; }
    #legend .open    { background: rgba(255,204,60,0.22); border: 1.8px solid #ffcc3c; }
    #legend .note    { margin-left: auto; font-size: 11px; opacity: 0.85; }
    #notelog { color: #c6cad1; }
    #legend { color: #c6cad1; }
    #hud .title  { color: #eef0f3; }
    #hud .artist { color: #b4bac2; }
    #hud .meta   { color: #b4bac2; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      background: #2a2d33; color: var(--text); font-size: 12px;
      margin-left: 6px;
    }
    @media (max-height: 560px) {
      #app { padding: 6px 8px 8px; }
      #hud { padding-bottom: 6px; gap: 8px; }
      #hud .title { font-size: 16px; }
      #hud .artist, #hud .meta, #hud-track, #legend, #notelog { display: none; }
      button.ctrl { font-size: 12px; padding: 4px 10px; }
      #scene-wrap { padding: 6px; }
      #timeline { margin-top: 8px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="title" id="hud-title">FretWise - Main fretteuse</div>
    <div class="artist" id="hud-artist"></div>
    <span class="badge" id="hud-track"></span>
    <div class="spacer"></div>
    <div class="meta" id="hud-meta"></div>
    <button class="ctrl" id="btn-rewind">Rewind</button>
    <button class="ctrl" id="btn-3d" title="Bascule rendu 3D (three.js) — expérimental">3D : off</button>
    <button class="ctrl primary" id="btn-play">Lecture</button>
  </div>

  <div id="scene-wrap">
    <!-- 3D mount (Milestone 5).  Empty + hidden by default; only populated when
         the OFF-by-default hand3d feature flag is on AND three.js/WebGL load.
         The SVG below stays the default, unchanged renderer. -->
    <div id="scene3d" style="display:none; width:100%;"></div>
    <svg id="scene" viewBox="0 0 1440 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fretWire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#e8e8ea"/>
          <stop offset="45%"  stop-color="#b5b7bb"/>
          <stop offset="55%"  stop-color="#6a6c70"/>
          <stop offset="100%" stop-color="#d0d2d4"/>
        </linearGradient>
        <linearGradient id="nutGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#f4eed8"/>
          <stop offset="100%" stop-color="#b9b093"/>
        </linearGradient>
        <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#141415"/>
          <stop offset="50%"  stop-color="#0a0a0b"/>
          <stop offset="100%" stop-color="#131314"/>
        </linearGradient>
        <linearGradient id="stringWound" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#d9c07a"/>
          <stop offset="45%"  stop-color="#a38645"/>
          <stop offset="55%"  stop-color="#5e4a1e"/>
          <stop offset="100%" stop-color="#c4a965"/>
        </linearGradient>
        <linearGradient id="stringPlain" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#f0f1f3"/>
          <stop offset="50%"  stop-color="#9fa2a6"/>
          <stop offset="100%" stop-color="#d4d6d9"/>
        </linearGradient>
        <radialGradient id="skinGrad" cx="0.5" cy="0.55" r="0.8">
          <stop offset="0%"   stop-color="#f6d6ba"/>
          <stop offset="70%"  stop-color="#e2b694"/>
          <stop offset="100%" stop-color="#b48264"/>
        </radialGradient>
        <radialGradient id="skinDark" cx="0.5" cy="0.5" r="0.7">
          <stop offset="0%"   stop-color="#d2a587"/>
          <stop offset="100%" stop-color="#966955"/>
        </radialGradient>
      </defs>

      <g id="layer-fretboard"></g>
      <g id="layer-shadow"></g>
      <g id="layer-hand"></g>
      <g id="layer-overlay"></g>
    </svg>
  </div>

  <div id="timeline"><div class="fill" id="timeline-fill"></div></div>
  <div id="legend">
    <span><span class="swatch active"></span>Actif — appuie (peau opaque)</span>
    <span><span class="swatch planted"></span>Touche sans sonner — bleu solide</span>
    <span><span class="swatch hover"></span>Survole — rouge solide</span>
    <span><span class="swatch idle"></span>Inutile — replié rouge/orange</span>
    <span><span class="swatch open"></span>Corde à vide en cours de sonner</span>
    <span class="note">Cordes : <b style="color:#c4a965">bronze</b> = filées (E2 A2 D3) / <b style="color:#d4d6d9">argent</b> = unies (G3 B3 E4)</span>
  </div>
  <div id="notelog">-</div>
</div>

<script>
/* ============================================================================
   FretWise - Hand visualization (top-down, hand-above-neck layout)

   Scene convention (corrected):
     - Nut on the LEFT, high frets to the right.
     - String 1 (high E)   at TOP   of the fretboard.
     - String 6 (low E)    at BOTTOM of the fretboard.
     - Guitarist sits BELOW the fretboard (off-screen at the bottom).
     - Forearm rises up from bottom, wrist passes UNDER the neck (partially
       hidden — rendered as a faint ghost stripe), and the hand emerges
       ABOVE the fretboard.
     - Fingers extend from the palm DOWN across the neck onto the strings.
     - Index is the LEFTMOST finger in the view, pinky the RIGHTMOST.
    Biomechanical simplification:
      - Fingers have unequal lengths and unequal lateral mobility.
      - MCP/PIP/DIP points bend along a visible phalanx arc; flexion also
        shortens projected reach.
      - Wrist deviation and forearm drift compensate for stretched shapes.
      - Fingers must keep anatomical order: index <= middle <= ring <= pinky.
    ========================================================================== */

/* ---------- Fretboard geometry (px) --------------------------------------- */
const SCENE_W = 1440, SCENE_H = 560;

const NUT_X    = 110;
const SCALE_PX = 1120;

/* ---------- Generalized geometry (mutable; derived from payload) ----------
   These were once hard-coded constants (15 frets, 6 strings, standard tuning,
   648 mm scale).  They are now `let` bindings recomputed by configureGeometry()
   at installData time from the payload's `fretboard` block, so drop tunings,
   capos, 7/8-string necks and notes above fret 15 all render correctly.  The
   defaults below reproduce the historical behaviour when a field is absent. */
let NUM_FRETS    = 15;
let NUM_STRINGS  = 6;
let SCALE_LENGTH_MM = 648;
let CAPO_FRET    = 0;

/* String order (FLIPPED): top = string 1 (high E), bottom = string 6 (low E). */
const STRING_Y_TOP     = 230;   // string 1 (highest string)
const STRING_Y_BOTTOM  = 350;   // last string (lowest)
let   STRING_SPACING   = (STRING_Y_BOTTOM - STRING_Y_TOP) / 5;
const BOARD_TOP_MARGIN = 24;
const BOARD_TOP_Y      = STRING_Y_TOP - BOARD_TOP_MARGIN;     // 206
const BOARD_BOT_Y      = STRING_Y_BOTTOM + BOARD_TOP_MARGIN;  // 374
const FOREARM_TOP_Y    = BOARD_BOT_Y + 8;                     // 382 — forearm emerges below here

/* ---------- Hand geometry (top view: palm above, thumb below) ------------- */
const PALM_TOP_Y  = 50;          // rest top of palm
const PALM_Y      = 118;         // rest palm centre
const MCP_Y       = 180;         // rest MCP line; dynamic in the simulator
const PALM_HALF_WIDTH = 72;
const PALM_CENTER_FROM_MCP = 62;
const PALM_TOP_FROM_MCP = 130;
const MCP_MIN_Y = 164;
const MCP_MAX_Y = 232;

/* ---------- Anatomical hand rig (van der Hulst 2012; Shimawaki CT) ---------
   The rig is grounded in published functional-anatomy data rather than values
   eyeballed from photos, and is driven by a single `handScale` factor so the
   same proportions serve any hand size (small junior hand .. large adult span)
   and tie into a future per-player profile.  Every px dimension below is
   `handScale × base proportion`; the default handScale reproduces the historical
   look exactly (regression-guarded in tests).

   Sources:
     - Proportions / phalanx ratios: van der Hulst, F.P.R. et al. (2012),
       "A functional anatomy based kinematic human hand model with simple size
       adaptation", IEEE ICRA — proximal:middle:distal phalanx lengths and a
       single isometric size-scaling parameter, exactly the `handScale` idea.
       Cross-checked against Buryanov & Kotiuk (2010) phalange anthropometry.
     - Joint flexion limits: Shimawaki et al. CT studies of finger MCP/PIP/DIP
       maximum flexion (see JOINT_FLEXION_MAX below).

   `handScale` is the single tunable: lengths, segment lengths and knuckle
   offsets all scale isometrically with it.  1.0 = today's adult-hand default. */
let handScale = 1.0;

/* Knuckle (MCP) lateral offsets in the palm-local frame, index leftmost.
   Base spacing is ~33-34 px between adjacent MCPs, centred near zero — the
   metacarpal heads are roughly evenly spread across the palm.  Scaled by
   handScale at configure time into the live MCP_OFFSETS used by the matrix. */
const MCP_OFFSETS_BASE = { index: -52, middle: -18, ring: +15, pinky: +49 };
let MCP_OFFSETS = { ...MCP_OFFSETS_BASE };   // recomputed by configureRig()
const HOME_FRET_OFFSET = { index: 0, middle: 1, ring: 2, pinky: 3 };

/* Per-finger total length as a multiple of the BASE finger unit (the middle
   finger = 1.0).  Ordering middle > ring ≈ index > pinky holds, matching
   van der Hulst / anthropometric data (index and ring are near-equal, ring
   marginally the longer of the two).  handScale × BASE_FINGER_UNIT × ratio
   gives px; the default reproduces the prior {176,194,184,158}. */
const BASE_FINGER_UNIT = 194;   // px length of the middle finger at handScale 1
const FINGER_LENGTH_RATIO = {
  index:  176 / BASE_FINGER_UNIT,   // 0.907
  middle: 194 / BASE_FINGER_UNIT,   // 1.000 (longest)
  ring:   184 / BASE_FINGER_UNIT,   // 0.948 (≈ index, slightly longer)
  pinky:  158 / BASE_FINGER_UNIT,   // 0.814 (shortest)
};
let FINGER_TOTAL = { index: 176, middle: 194, ring: 184, pinky: 158 };

/* Phalanx length proportions (proximal : middle : distal) as fractions of the
   finger's total length, from van der Hulst (2012) Table I / Buryanov & Kotiuk
   (2010).  The proximal phalanx is the longest (≈1.6-1.7× the distal), the
   middle is intermediate, the distal shortest — these are pure ratios so they
   are size-independent and need no scaling.  PIP sits at `proximal`, DIP at
   `proximal + middle` along the finger axis. */
const FINGER_SEG   = {
  index:  { proximal: 0.44, middle: 0.28, distal: 0.28 },
  middle: { proximal: 0.43, middle: 0.29, distal: 0.28 },
  ring:   { proximal: 0.44, middle: 0.28, distal: 0.28 },
  pinky:  { proximal: 0.46, middle: 0.27, distal: 0.27 },
};

/* ---------- Joint flexion limits (Shimawaki CT studies) -------------------
   Maximum active flexion per joint, normalised to the model's 0..1 "flexion"
   parameter (0 = straight, 1 = the rig's fully-curled silhouette).  Shimawaki
   et al. report approximate max flexion of MCP ≈ 90°, PIP ≈ 110°, DIP ≈ 70-80°.
   The dominant joint for the press silhouette is the MCP/PIP curl; we cap the
   solver's flexion parameter at the PIP-limited value (~0.90) instead of the
   ad-hoc 0.95, and clamp the base curl-from-reach term at the MCP limit. */
const JOINT_FLEXION_MAX = {
  mcp: 90 / 110,   // ≈ 0.818  (MCP max ≈ 90° of the PIP-scaled range)
  pip: 1.0,        // PIP is the reference joint (≈ 110° → full curl)
  dip: 78 / 110,   // ≈ 0.709  (DIP max ≈ 78°)
};
/* Overall flexion-parameter ceiling: PIP-limited, just under fully curled. */
const FLEXION_MAX = 0.90;
/* Base-curl ceiling (reach-driven term, before role boosts): MCP-limited. */
const BASE_FLEX_MAX = JOINT_FLEXION_MAX.mcp;   // 0.818

/* ---------- DIP↔PIP coupling (tunable, task-dependent) --------------------
   The natural coupling DIP ≈ ⅔·PIP is only a rule of thumb (Shimawaki; Kapandji
   "Physiology of the Joints").  For thin fingertip-on-fret contact the distal
   phalanx is nearly perpendicular to the string and barely flexed, i.e. the LOW
   end of the coupling range, so press/plant poses use a reduced ratio while
   idle/hover folds use the relaxed default. */
const DIP_PIP_COUPLING_DEFAULT = 0.673;  // ≈ ⅔ rule-of-thumb (idle/hover folds)
const DIP_PIP_COUPLING_PRESS   = 0.42;   // fingertip-on-fret: distal near-straight
function dipPipCoupling(role) {
  return (role === "active" || role === "planted")
    ? DIP_PIP_COUPLING_PRESS
    : DIP_PIP_COUPLING_DEFAULT;
}

/* Compute the live px rig from handScale.  Called from configureGeometry() so a
   payload (or future profile) can resize the whole hand. */
function configureRig(scale) {
  handScale = (typeof scale === "number" && scale > 0) ? scale : 1.0;
  for (const f of ["index", "middle", "ring", "pinky"]) {
    FINGER_TOTAL[f] = handScale * BASE_FINGER_UNIT * FINGER_LENGTH_RATIO[f];
    MCP_OFFSETS[f]  = handScale * MCP_OFFSETS_BASE[f];
  }
}

const FINGER_WIDTH = { index: 22, middle: 24, ring: 22, pinky: 19 };
const NAIL_RADIUS  = { index: 12, middle: 13, ring: 12, pinky: 10 };
const MAX_ABDUCTION_PX = { index: 70, middle: 64, ring: 52, pinky: 43 };
const DESIRED_REACH_Y = { index: 58, middle: 65, ring: 62, pinky: 50 };
const FOLD_X_OFFSET = { index: -14, middle: -4, ring: 8, pinky: 18 };
const FOLD_Y_OFFSET = { index: 24, middle: 22, ring: 21, pinky: 19 };
const HOVER_Y_OFFSET = -12;       // hover above string plane, visibly not pressing
const UPCOMING_WINDOW_SEC = 1.8;  // red hover if a finger is needed soon
const THUMB_OPEN_Y = BOARD_BOT_Y + 7;
const THUMB_DEFAULT_Y = BOARD_BOT_Y + 7;
const THUMB_BARRE_Y = BOARD_BOT_Y + 7;
const THUMB_TO_INDEX_X = 18;
const THUMB_SMOOTH = 0.12;

/* Folded rest: tip short distance below MCP, staying ABOVE the board
   (BOARD_TOP_Y = 206). Tip at y = MCP_Y + REST_TIP_Y_OFFSET = 188 < 206 ✓. */
const REST_TIP_Y_OFFSET = 28;

const FINGER_ORDER = ["index", "middle", "ring", "pinky"];
const FINGER_LABEL = { index: "i", middle: "m", ring: "r", pinky: "p" };
const HAND_MODEL_LABEL = "modele biomecanique v8 anatomique handScale";

/* Strict kinematic rules for this top-view model:
  1. The fretboard is fixed. The top of the image is the far/high-E side;
    the bottom is the near/low-E side.
  2. Fingertips may press strings, but MCP bases never slide independently.
    The four MCPs are fixed offsets in the palm local coordinate system.
  3. A note that is hard to reach is solved by whole-hand displacement
    (translation), wrist roll (rotation), and mild palm cup deformation.
    solveFinger() is not allowed to move either endpoint.
  4. The visible palm is the back of the hand over or slightly above the neck.
    The thumb belongs to the opposite jaw of the clamp and appears below the
    neck, not above it.

  Local-to-world MCP matrix for each finger f:
    [x]   [palmX]   [ cosθ  -sinθ ] [MCP_OFFSETS[f]]
    [y] = [pivotY] + [ sinθ   cosθ ] [0]
  The deformation matrix is intentionally low-dimensional:
    translateY = wrist/palm depth toward strings
    θ          = wrist roll, mostly helping ring and pinky reach low strings
    cup        = small vertical rounding of the palm silhouette only
*/
const MAX_WRIST_ROT    = 0.61;   // radians ≈ 35°
const WRIST_ROT_SMOOTH = 0.14;  // damping time-constant (s) for wrist rotation

/* ---------- Chord detection ------------------------------------------------
   Open-string MIDI base per string (index 0 = string 1 = highest string).
   Mutable: derived from the payload tuning by configureGeometry(); the default
   is standard 6-string tuning (high E .. low E). */
let STRING_MIDI_BASE = [64, 59, 55, 50, 45, 40];
function midiForPosition(string, fret) {
  // Account for a capo: it raises every open string by CAPO_FRET semitones.
  return STRING_MIDI_BASE[string - 1] + CAPO_FRET + fret;
}

/* Parse a note-name+octave string (e.g. "E2", "F#3", "Db4") to a MIDI pitch.
   Returns null when unparseable so the caller can fall back. */
const _NOTE_TO_PC = {
  C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6,
  Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11,
};
function noteNameToMidi(name) {
  if (typeof name === 'number') return name;        // already a MIDI int
  if (typeof name !== 'string') return null;
  const m = name.trim().match(/^([A-Ga-g])([#b]?)(-?\d+)$/);
  if (!m) return null;
  const letter = m[1].toUpperCase();
  const pc = _NOTE_TO_PC[letter + m[2]];
  if (pc === undefined) return null;
  return pc + (parseInt(m[3], 10) + 1) * 12;        // C4 = MIDI 60
}

/* ---------- Geometry configuration (called at installData time) -----------
   Derive the mutable fret/string/tuning/scale/capo geometry from the payload's
   `fretboard` block.  Every field is optional; absent fields keep the historical
   defaults so older payloads (and the embedded demo) render unchanged. */
function configureGeometry(data) {
  const fb = (data && data.fretboard) || {};

  // Size-adapt the anatomical hand rig.  handScale comes from the payload's
  // `hand` block (a future per-player profile) or defaults to 1.0 (today's
  // adult-hand look).  Driving FINGER_TOTAL / MCP_OFFSETS off a single factor
  // keeps the rig proportions anatomical at any hand size.
  const handCfg = (data && data.hand) || {};
  configureRig(typeof handCfg.scale === "number" ? handCfg.scale : 1.0);

  // Tuning drives both the per-string MIDI base and the string count.  The
  // payload lists open strings low→high (index 0 = lowest), matching the API
  // and the fretboard labels (tuning[NUM_STRINGS - s]).  STRING_MIDI_BASE is
  // indexed high→low (index 0 = string 1 = highest), so reverse it.
  let midiLowToHigh = null;
  if (Array.isArray(fb.tuning) && fb.tuning.length >= 2) {
    const parsed = fb.tuning.map(noteNameToMidi);
    if (parsed.every((p) => typeof p === 'number' && !Number.isNaN(p))) {
      midiLowToHigh = parsed;
    }
  }
  if (midiLowToHigh) {
    NUM_STRINGS = midiLowToHigh.length;
    STRING_MIDI_BASE = midiLowToHigh.slice().reverse();   // high→low
  } else {
    NUM_STRINGS = (typeof fb.num_strings === 'number' && fb.num_strings >= 2)
      ? fb.num_strings : 6;
    STRING_MIDI_BASE = [64, 59, 55, 50, 45, 40];
  }

  NUM_FRETS = (typeof fb.num_frets === 'number' && fb.num_frets >= 1)
    ? Math.round(fb.num_frets) : 15;
  SCALE_LENGTH_MM = (typeof fb.scale_length_mm === 'number' && fb.scale_length_mm > 0)
    ? fb.scale_length_mm : 648;
  CAPO_FRET = (typeof fb.capo === 'number' && fb.capo > 0)
    ? Math.round(fb.capo) : 0;

  // String spacing keeps the fixed Y band; divide by (strings - 1) so any
  // string count fills the same neck height.
  STRING_SPACING = (NUM_STRINGS > 1)
    ? (STRING_Y_BOTTOM - STRING_Y_TOP) / (NUM_STRINGS - 1)
    : 0;
}

/* Chord quality templates: offsets from root (pitch-class arithmetic). */
const CHORD_TEMPLATES = [
  { name: '',     offsets: [0, 4, 7]       },   // major
  { name: 'm',    offsets: [0, 3, 7]       },   // minor
  { name: 'sus2', offsets: [0, 2, 7]       },   // sus2
  { name: 'sus4', offsets: [0, 5, 7]       },   // sus4
  { name: 'maj7', offsets: [0, 4, 7, 11]   },   // major 7
  { name: '7',    offsets: [0, 4, 7, 10]   },   // dominant 7
  { name: 'm7',   offsets: [0, 3, 7, 10]   },   // minor 7
  { name: 'dim',  offsets: [0, 3, 6]       },   // diminished
  { name: 'aug',  offsets: [0, 4, 8]       },   // augmented
  { name: 'add9', offsets: [0, 4, 7, 2]    },   // add 9
  { name: '5',    offsets: [0, 7]          },   // power chord
];
const NOTE_NAMES    = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const NOTE_NAMES_FR = ['Do','Réb','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];

/* Convert an Anglo-Saxon chord name (e.g. "Cmaj7", "F#m") to French notation
   (e.g. "Do maj7", "Fa# m").  The root is translated; the quality suffix is
   kept as-is and separated by a non-breaking space for readability. */
function chordNameFrench(angleName) {
  if (!angleName) return '';
  const twoChar = angleName.length > 1 && (angleName[1] === 'b' || angleName[1] === '#');
  const root    = twoChar ? angleName.slice(0, 2) : angleName[0];
  const suffix  = angleName.slice(twoChar ? 2 : 1);
  const idx     = NOTE_NAMES.indexOf(root);
  if (idx < 0) return angleName;
  const frRoot  = NOTE_NAMES_FR[idx];
  return suffix ? frRoot + '\u00a0' + suffix : frRoot;
}

function detectChordName(pitchClasses) {
  const pcSet = new Set(pitchClasses.map(p => ((p % 12) + 12) % 12));
  if (pcSet.size < 2) return null;
  let bestScore = -1, bestName = null;
  for (let root = 0; root < 12; root++) {
    for (const tmpl of CHORD_TEMPLATES) {
      const tPCs = new Set(tmpl.offsets.map(o => (root + o) % 12));
      let matches = 0;
      for (const pc of tPCs) { if (pcSet.has(pc)) matches++; }
      if (matches < 2) continue;
      const score = matches + (matches === tPCs.size ? tPCs.size * 0.5 : 0);
      if (score > bestScore) {
        bestScore = score;
        bestName  = NOTE_NAMES[root] + tmpl.name;
      }
    }
  }
  return bestName;
}

/* Pre-compute chord groups from frame data.
   A chord group = maximal segment with the same hand_position where ≥ 2
   distinct fretted fingers appear.  When the animation enters a group, all
   fingers in that group are snapped to their positions simultaneously — the
   guitarist "frets the chord shape" before arpegiating. */
function buildChordGroups(frames) {
  const groups = [];
  let i = 0;
  while (i < frames.length) {
    const hp       = frames[i].hand_position;
    const startSec = frames[i].onset_sec;
    const MAX_SPAN = 6.0;
    const fingerTargets = {};
    let j = i;
    while (j < frames.length &&
           frames[j].hand_position === hp &&
           frames[j].onset_sec - startSec <= MAX_SPAN) {
      const f = frames[j];
      if (f.finger !== 'open' && f.fret > 0 && !fingerTargets[f.finger]) {
        fingerTargets[f.finger] = {
          string: f.string, fret: f.fret,
          pitch: f.pitch || midiForPosition(f.string, f.fret),
        };
      }
      j++;
    }
    if (Object.keys(fingerTargets).length >= 2) {
      const pitches = Object.values(fingerTargets).map(t => t.pitch);
      const pcs     = [...new Set(pitches.map(p => ((p % 12) + 12) % 12))];
      groups.push({
        id: groups.length,
        startSec,
        handPosition: hp,
        fingerTargets,
        chordName: detectChordName(pcs) || '',
      });
    }
    // Advance to next hp segment.
    while (i < frames.length && frames[i].hand_position === hp) i++;
  }
  return groups;
}

/* ---------- Fretboard maths ---------------------------------------------- */
function fretX(f) {
  if (f <= 0) return NUT_X;
  return NUT_X + SCALE_PX * (1 - Math.pow(2, -f / 12));
}
function pressX(f) {
  if (f === 0) return NUT_X - 14;
  return (fretX(f - 1) + fretX(f)) / 2;
}
function stringY(s) {
  // s = 1 (high E) at top, s = 6 (low E) at bottom
  return STRING_Y_TOP + (s - 1) * STRING_SPACING;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function interpPoint(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function angleDeg(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

/* Finger width scaled to fret spacing so fingers look proportionally correct
   at any position along the neck (wider at nut, narrower at high frets). */
function fingerPxWidth(name, fret) {
  if (fret <= 0 || fret > NUM_FRETS) return FINGER_WIDTH[name];
  const fw = fretX(fret) - fretX(fret - 1);
  const k = { index: 0.50, middle: 0.54, ring: 0.48, pinky: 0.42 }[name];
  return Math.max(14, Math.min(36, fw * k));
}

/* ---------- Finger kinematics (rigid phalanx chain, forward kinematics) ----
   This is intentionally not a full 3D anatomical solver.  It is a constrained
   2.5D model tuned to guitar photographs, but the joints are now placed by
   FORWARD KINEMATICS — walking tip-ward from the MCP and rotating each rigid
   phalanx about its proximal joint — instead of laterally bowing control
   points.  That keeps the three phalanges straight (rigid links) and expresses
   curl as honest segment rotation:
       pip = mcp + R(θ_mcp)               · proxVec
       dip = pip + R(θ_mcp + θ_pip)       · midVec
       tip stays at the IK target (the fret-contact point) so the nail / note
           burst / barre pad keep landing exactly on the string; the distal
           phalanx is the rigid link dip → tip.
   The θ angles are DERIVED from the same flexion / curl / DIP-PIP-coupling
   terms used before (preserving the M3 Shimawaki caps and dipPipCoupling as the
   angle source) — they are merely re-expressed from a lateral bow into a
   rotation, so flexion bounds and coupling behaviour are unchanged. */
function solveFinger(mcpX, mcpY, tipX, tipY, name, role) {
  const L = FINGER_TOTAL[name];
  let dx = tipX - mcpX, dy = tipY - mcpY;

  const maxAbd = MAX_ABDUCTION_PX[name];
  let d  = Math.hypot(dx, dy);
  const roleReach = role === "idle" ? 0.58 : role === "hover" ? 0.82 : 0.96;
  const maxReach = L * roleReach;
  const reachOver = Math.max(0, d - maxReach);
  const abductionOver = Math.max(0, Math.abs(dx) - maxAbd);
  if (reachOver > 0 && d > 0) {
    const k = maxReach / d;
    tipX = mcpX + dx * k;
    tipY = mcpY + dy * k;
    dx = tipX - mcpX;
    dy = tipY - mcpY;
    d = maxReach;
  }

  const seg = FINGER_SEG[name];
  const pipT = seg.proximal;
  const dipT = seg.proximal + seg.middle;
  const ux = d > 0 ? dx / d : 0;
  const uy = d > 0 ? dy / d : 1;
  const nx = -uy;
  const ny = ux;

  // Base curl from how far the reach falls short of full extension, capped at
  // the MCP flexion limit (Shimawaki: MCP max ≈ 90°, the BASE_FLEX_MAX ratio).
  const baseFlex = clamp(1 - Math.min(d, maxReach) / L, 0, BASE_FLEX_MAX);
  const flatness = Math.abs(dx) / Math.max(1, Math.abs(dy));
  const perpendicularBoost = (role === "active" || role === "planted")
    ? clamp((flatness - 0.75) * 0.14 + (abductionOver + reachOver) * 0.0018, 0, 0.24)
    : 0;
  const roleBoost = role === "idle" ? 0.38 : role === "hover" ? 0.18 : 0.04;
  // Total flexion parameter is PIP-limited (the dominant press joint, ≈ 110°),
  // capped just under the rig's fully-curled silhouette.
  const flexion = clamp(baseFlex + roleBoost, 0, FLEXION_MAX);
  const sideBias = { index: -0.18, middle: -0.05, ring: 0.12, pinky: 0.24 }[name];
  // The old code converted (flexion + perpendicularBoost) into a px "bow"
  // amount; we reuse the SAME scalar but interpret it as a total flexion angle
  // (radians) distributed across the MCP/PIP/DIP joints.  curlMag ∈ [0,1]ish.
  const curlMag = (flexion + perpendicularBoost)
    * (role === "active" || role === "planted" ? 0.74 : 0.9);
  // Folded/hover "tuck" used to pull joints upward in px; re-express it as a
  // small extra rotation so a folded finger curls back toward the palm.
  const tuck = (role === "idle" ? 14 : role === "hover" ? 5 : 0)
    * { index: 0.65, middle: 0.8, ring: 1.08, pinky: 1.24 }[name];
  const tuckAngle = tuck * 0.014;   // px → rad scale, matched to prior feel

  // Per-joint flexion angles (radians).  The total curl is shared so the PIP is
  // the dominant joint (press silhouette), the MCP contributes the base bend,
  // and the DIP follows the tunable DIP↔PIP coupling (lower for a press, near
  // the ⅔ rule for idle/hover folds).  Capped per joint by the Shimawaki
  // JOINT_FLEXION_MAX ratios re-expressed as radians (PIP ≈ 110° is the unit).
  const PIP_FULL = 110 * Math.PI / 180;   // PIP reference range (the "1.0" joint)
  const coupling = dipPipCoupling(role);
  const θ_pip = clamp(curlMag * 0.62 * PIP_FULL + tuckAngle * 0.55,
                      0, JOINT_FLEXION_MAX.pip * PIP_FULL);
  const θ_mcp = clamp(curlMag * 0.40 * PIP_FULL + tuckAngle * 0.45,
                      0, JOINT_FLEXION_MAX.mcp * PIP_FULL);
  const θ_dip = clamp(θ_pip * coupling, 0, JOINT_FLEXION_MAX.dip * PIP_FULL);

  // Lateral splay: the proximal phalanx fans slightly off the MCP→tip axis per
  // finger (the old `sideBias`).  Applied as a small constant rotation of the
  // whole chain about the MCP so fingers don't all stack parallel.
  const splay = sideBias * 0.20;   // rad

  // Phalanx lengths from the (clamped) reach so the chain still spans toward the
  // tip; the distal phalanx is the rigid link dip → tip, drawn afterwards.
  const proxLen = d * pipT;
  const midLen  = d * (dipT - pipT);

  // The bend folds the finger toward the palm-perpendicular `(nx,ny)` direction
  // — the same direction the old control points bowed along.  We rotate the
  // base axis `(ux,uy)` by cumulative joint angles to walk the chain tip-ward.
  // `rot(v, a)` rotates a unit-axis-aligned step into world space.
  function step(len, ang) {
    const a = ang;
    const cs = Math.cos(a), sn = Math.sin(a);
    // Rotate the base direction (ux,uy) toward the normal (nx,ny) by `a`:
    //   dir = cos(a)·u + sin(a)·n
    return {
      x: (ux * cs + nx * sn) * len,
      y: (uy * cs + ny * sn) * len,
    };
  }

  const mcp = { x: mcpX, y: mcpY };
  const tip = { x: tipX, y: tipY };
  // Walk: MCP → PIP rotated by (splay + θ_mcp); PIP → DIP rotated by
  // (splay + θ_mcp + θ_pip).  Cumulative rotations = true forward kinematics.
  const aMcp = splay + θ_mcp;
  const aPip = splay + θ_mcp + θ_pip;
  const sProx = step(proxLen, aMcp);
  const pip = { x: mcp.x + sProx.x, y: mcp.y + sProx.y };
  const sMid = step(midLen, aPip);
  const dip = { x: pip.x + sMid.x, y: pip.y + sMid.y };

  return {
    mcp,
    pip,
    dip,
    tip,
    flexion,
    projLen: d,
  };
}

/* ---------- Frame sampling ------------------------------------------------
   At time t, return:
     handPos      — current hand_position (snapshot of latest started frame)
     active       — finger -> {string, fret, strings[], ...} (pressing = sounding)
     planted      — finger -> {string, fret, strings[]} (sedentary, still pressed)
     recent       — finger -> last onset_sec (for pulse halo)
     openStrings  — set of string numbers currently played open (fret = 0)
     openRecent   — string -> most recent open onset (for pulse)
   A "barre" is ONLY detected when multiple notes with the same finger are
   *simultaneously* active at time t AND on *adjacent* strings.  Sequential
   re-use of the same finger at the same fret on non-adjacent strings (eg
   index alternating between s6 bass and s1 melody) is NOT a barre. */
/* Normalise a planted-finger payload entry into {string, fret, strings[]}.
   Accepted shapes (most specific first):
     [startString, fret, endString]      — an explicit barre range (inclusive)
     [string, fret, {strings:[...]}]      — an explicit strings list
     [string, fret]                       — a single-string plant (v1 shape)
   The returned `strings` is always a contiguous low→high range; `string` is the
   first (lowest-numbered) string of that range. */
function parsePlanted(p) {
  if (!Array.isArray(p)) return { string: 0, fret: 0, strings: [] };
  const fret = p[1];
  let strings;
  if (p.length >= 3 && p[2] && Array.isArray(p[2].strings)) {
    strings = p[2].strings.slice();
  } else if (p.length >= 3 && typeof p[2] === "number") {
    const lo = Math.min(p[0], p[2]);
    const hi = Math.max(p[0], p[2]);
    strings = [];
    for (let s = lo; s <= hi; s++) strings.push(s);
  } else {
    strings = [p[0]];
  }
  strings.sort((a, b) => a - b);
  return { string: strings[0], fret, strings };
}

function sampleState(t, frames) {
  let handPos = 1;
  let lastFrame = null;
  const active  = {};              // finger -> { string, fret, ... }
  const planted = {};              // finger -> { string, fret }
  const upcoming = {};             // finger -> next target soon enough to hover
  const recent  = {};
  const activeByFretByFinger = {}; // fname -> fret -> Set<string>
  const openStrings = new Set();
  const openRecent  = {};

  for (const f of frames) {
    if (f.onset_sec > t + 0.001) break;
    // Only fretted notes anchor the palm position.  Open strings carry a
    // Viterbi-assigned hp that reflects the upcoming fretted note (look-ahead
    // cost minimisation), not where the hand currently sits.  Letting open
    // strings drive handPos causes the palm to jump ahead while the fretted
    // fingers (correctly at hp=1) appear over-extended to the left.
    if (typeof f.hand_position === "number" && f.finger !== "open" && f.fret > 0) {
      handPos = f.hand_position;
    }
    lastFrame = f;
    if (t < f.onset_sec + f.duration_sec) {
      if (f.fret === 0 || f.finger === "open") {
        openStrings.add(f.string);
        openRecent[f.string] = f.onset_sec;
      } else if (f.finger !== "open" && f.fret > 0) {
        active[f.finger] = {
          string: f.string, fret: f.fret,
          onset_sec: f.onset_sec, duration_sec: f.duration_sec,
        };
        recent[f.finger] = f.onset_sec;
        if (!activeByFretByFinger[f.finger]) activeByFretByFinger[f.finger] = {};
        if (!activeByFretByFinger[f.finger][f.fret]) {
          activeByFretByFinger[f.finger][f.fret] = new Set();
        }
        activeByFretByFinger[f.finger][f.fret].add(f.string);
      }
    }
  }
  if (lastFrame && lastFrame.planted) {
    for (const fname in lastFrame.planted) {
      if (active[fname]) continue;
      // A planted finger may hold a single string ([string, fret]) or a barre
      // laid across a contiguous range of strings.  The range is carried either
      // as a third element ([startString, fret, endString]) or as an explicit
      // strings array ([..., {strings:[...]}]).  We normalise to {string, fret,
      // strings[]} so the renderer treats a planted barre exactly like an active
      // one (centre-targeted finger, bar pad across the range).
      const p = lastFrame.planted[fname];
      planted[fname] = parsePlanted(p);
    }
  }

  /* Strict barre detection: contiguous adjacent strings only, and only
     counting notes that are ACTIVE at the current instant (no lookahead).
     This correctly distinguishes real barres from "index-covers-bass-then-
     treble" cases that only look like a barre because of the time window. */
  function extendContiguous(startString, allStrings) {
    const result = [startString];
    for (let s = startString + 1; allStrings.has(s); s++) result.push(s);
    for (let s = startString - 1; allStrings.has(s); s--) result.unshift(s);
    return result;
  }
  for (const fname in active) {
    const fretSet = activeByFretByFinger[fname] &&
                    activeByFretByFinger[fname][active[fname].fret];
    if (fretSet && fretSet.size > 1) {
      active[fname].strings = extendContiguous(active[fname].string, fretSet);
    } else {
      active[fname].strings = [active[fname].string];
    }
  }
  for (const fname in planted) {
    // A planted finger can hold a barre across a contiguous string range (carried
    // in the payload), mirroring how `active` handles barres.  parsePlanted()
    // already populated `strings`; fall back to the single anchor string when the
    // payload only gave a point.  We re-anchor `string` to the range's first
    // string so downstream centre-targeting sees a consistent low→high order.
    const pl = planted[fname];
    if (!Array.isArray(pl.strings) || pl.strings.length === 0) {
      pl.strings = [pl.string];
    }
    pl.string = pl.strings[0];
  }

  for (const f of frames) {
    if (f.onset_sec <= t + 0.001) continue;
    if (f.onset_sec - t > UPCOMING_WINDOW_SEC) break;
    if (!f.finger || f.finger === "open" || f.fret <= 0) continue;
    if (active[f.finger] || planted[f.finger] || upcoming[f.finger]) continue;
    upcoming[f.finger] = {
      string: f.string,
      fret: f.fret,
      onset_sec: f.onset_sec,
      strings: [f.string],
    };
  }

  return { handPos, active, planted, upcoming, recent, openStrings, openRecent };
}

function solveTargetHandPose(s, fallbackHandPos) {
  const targets = collectHandTargets(s);
  if (!targets.length) {
    return {
      handPos:     s.handPos,
      pivotX:      pressX(s.handPos) - MCP_OFFSETS.index,
      pivotY:      MCP_Y,
      wristRot:    0,
      forearmBias: 0,
      palmCup:     0,
      thumb:       solveThumbAnchor([], s.handPos, 0, false, false),
    };
  }

  /* Step 1 — hand position (index-finger fret).  Weighted average of each
     target finger converted to an index-equivalent fret.  Clamped to stay
     within ±2.5 frets of the current smooth position. */
  let wSum = 0, hpSum = 0;
  for (const t of targets) {
    wSum  += t.weight;
    hpSum += (t.fret - HOME_FRET_OFFSET[t.finger]) * t.weight;
  }
  const handPos = clamp(hpSum / wSum, Math.max(1, fallbackHandPos - 2.5), fallbackHandPos + 2.5);
  const cluster = analyseTargetCluster(targets);
  const pivotX = pressX(handPos) - MCP_OFFSETS.index;
  const thumb = solveThumbAnchor(targets, handPos, cluster.bassDemand, cluster.openChord, cluster.barre);

  /* Step 2 — palm depth.  Each finger votes for the palm Y that lets its
     fixed MCP reach the target string.  We bias toward the deepest required
     value so ring/pinky on low strings pull the whole hand down instead of
     detaching from the palm. */
  let pivotY = MCP_MIN_Y;
  for (const t of targets) {
    const needed = t.y - DESIRED_REACH_Y[t.finger];
    const pull = t.weight * (t.string >= 4 ? 1.0 : 0.72);
    pivotY = Math.max(pivotY, needed * pull + pivotY * (1 - pull));
  }
  pivotY = clamp(pivotY, MCP_MIN_Y, MCP_MAX_Y);

  /* Step 3 — wrist rotation θ (palm origin, CW positive).
     With rotation, each finger's MCP Y satisfies:
       mcpY[f] = pivotY + MCP_OFFSETS[f] × sin(θ)
    Inverting for sin(θ) and taking a weighted mean gives θ. */
  let sinNum = 0, sinDen = 0;
  for (const t of targets) {
    const naturalDx = MCP_OFFSETS[t.finger];
    if (Math.abs(naturalDx) < 1) continue;
    const idealMcpY = t.y - DESIRED_REACH_Y[t.finger];
    sinNum += ((idealMcpY - pivotY) / naturalDx) * t.weight;
    sinDen += t.weight;
  }
  const sinTheta = sinDen > 0 ? sinNum / sinDen : 0;
  const ergonomicRoll = cluster.bassDemand > 3.8 ? 0.12 : cluster.openChord ? 0.06 : 0;
  const wristRot = clamp(
    Math.asin(clamp(sinTheta, -Math.sin(MAX_WRIST_ROT), Math.sin(MAX_WRIST_ROT))) + ergonomicRoll,
    -MAX_WRIST_ROT,
    MAX_WRIST_ROT
  );

  /* Step 4 — forearm bias (extra lateral pull for bass-string clusters). */
  const lowStringPull = targets.reduce((acc, t) => acc + (t.y - STRING_Y_TOP) * t.weight, 0) / wSum;
  return {
    handPos,
    pivotX,
    pivotY,
    wristRot,
    forearmBias: clamp((lowStringPull - 55) * 0.28, -18, 26),
    palmCup: clamp((cluster.bassDemand - 3.2) * 0.18 + cluster.span * 0.035, 0, 0.34),
    thumb,
  };
}

function analyseTargetCluster(targets) {
  if (!targets.length) {
    return { minFret: 0, maxFret: 0, span: 0, openChord: false, barre: false, bassDemand: 0 };
  }
  let minFret = Infinity, maxFret = -Infinity, wSum = 0, stringSum = 0;
  let barre = false;
  for (const t of targets) {
    minFret = Math.min(minFret, t.fret);
    maxFret = Math.max(maxFret, t.fret);
    wSum += t.weight;
    stringSum += t.string * t.weight;
    if (t.strings && t.strings.length > 1) barre = true;
  }
  const span = maxFret - minFret;
  const openChord = targets.length >= 2 && maxFret <= 4 && span <= 4;
  return { minFret, maxFret, span, openChord, barre, bassDemand: stringSum / Math.max(0.001, wSum) };
}

function solveThumbAnchor(targets, handPos, bassDemand, openChord, barre) {
  const centerFret = targets.length
    ? targets.reduce((acc, t) => acc + t.fret * t.weight, 0)
      / targets.reduce((acc, t) => acc + t.weight, 0)
    : handPos + 1.5;
  const x = pressX(centerFret) - THUMB_TO_INDEX_X;
  if (barre) {
    return { x, y: THUMB_BARRE_Y, angle: 82, role: "barre" };
  }
  if (openChord) {
    return { x: x - 8, y: THUMB_OPEN_Y, angle: 88, role: "open" };
  }
  const y = clamp(THUMB_DEFAULT_Y - (bassDemand - 3.2) * 4, THUMB_BARRE_Y, THUMB_OPEN_Y);
  return { x, y, angle: 84, role: "default" };
}

function collectHandTargets(s) {
  const targets = [];
  for (const f of FINGER_ORDER) {
    const active = s.active[f];
    const planted = s.planted[f];
    const src = active || planted;
    if (!src || src.fret === 0) continue;
    const strings = src.strings || [src.string];
    const ymin = stringY(strings[0]);
    const ymax = stringY(strings[strings.length - 1]);
    targets.push({
      finger: f,
      fret: src.fret,
      string: strings.reduce((acc, s) => acc + s, 0) / strings.length,
      strings,
      x: pressX(src.fret),
      y: (ymin + ymax) / 2,
      weight: active ? 1.0 : planted ? 0.72 : 0.28,
    });
  }
  return targets;
}

/* ---------- Hand simulator ------------------------------------------------ */
class HandSimulator {
  constructor() {
    this.palmX = pressX(3) - MCP_OFFSETS.index;
    this.smoothHandPos = 3;
    this.pivotY    = MCP_Y;    // Y-position of the palm origin / knuckle line
    this.wristRot  = 0;        // radians, CW = pinky toward bass strings
    this.palmCup   = 0;        // silhouette deformation only, MCP anchors stay fixed
    this.forearmDrift = 0;     // px; forearm lateral sway
    this.thumb = solveThumbAnchor([], 3, 0, false, false);
    this.chordGroupId = -1;
    this.fingers = {};
    for (const f of FINGER_ORDER) {
      this.fingers[f] = {
        tipX: this.palmX + MCP_OFFSETS[f],
        tipY: this.pivotY + REST_TIP_Y_OFFSET,
        role: "idle",       // "active" | "planted" | "hover" | "idle"
        fret: 0,
        strings: [],        // string range under the finger if barring
        lastOnset: -999,
      };
    }
  }

  /* Returns the MCP position from the fixed palm matrix.  These attachment
     points never move relative to each other; only palmX/pivotY/wristRot move. */
  getMcpPos(finger) {
    const dx = MCP_OFFSETS[finger];
    return {
      x: this.palmX + dx * Math.cos(this.wristRot),
      y: this.pivotY  + dx * Math.sin(this.wristRot),
    };
  }

  update(t, dt, frames, chordGroups) {
    const s = sampleState(t, frames);
    const pose = solveTargetHandPose(s, this.smoothHandPos);
    const targetPalm = pose.pivotX;
    const hpDelta = Math.abs(pose.handPos - this.smoothHandPos);
    const smoothK = hpDelta <= 2 ? Math.min(1, dt / 0.055) : Math.min(1, dt / 0.11);
    this.palmX         += (targetPalm          - this.palmX)     * smoothK;
    this.smoothHandPos += (pose.handPos         - this.smoothHandPos) * smoothK;
    this.pivotY        += (pose.pivotY          - this.pivotY)    * Math.min(1, dt / 0.10);
    this.wristRot      += (pose.wristRot        - this.wristRot)  * Math.min(1, dt / WRIST_ROT_SMOOTH);
    this.palmCup       += ((pose.palmCup || 0)   - this.palmCup)   * Math.min(1, dt / 0.16);
    this.thumb.x       += (pose.thumb.x         - this.thumb.x)   * Math.min(1, dt / THUMB_SMOOTH);
    this.thumb.y       += (pose.thumb.y         - this.thumb.y)   * Math.min(1, dt / THUMB_SMOOTH);
    this.thumb.angle   += (pose.thumb.angle     - this.thumb.angle) * Math.min(1, dt / THUMB_SMOOTH);
    this.thumb.role     = pose.thumb.role;
    const targetForearmDrift = clamp((this.palmX - targetPalm) * 0.18 + pose.forearmBias, -34, 42);
    this.forearmDrift  += (targetForearmDrift   - this.forearmDrift) * Math.min(1, dt / 0.18);

    // ---- Chord-snap logic ----
    // Find the chord group that has most recently started (startSec ≤ t).
    let cgId = -1;
    if (chordGroups) {
      for (let k = 0; k < chordGroups.length; k++) {
        if (chordGroups[k].startSec <= t) cgId = k; else break;
      }
    }
    const cgChanged = cgId !== this.chordGroupId;
    this.chordGroupId = cgId;
    const cg = cgId >= 0 ? chordGroups[cgId] : null;

    for (const f of FINGER_ORDER) {
      const fg   = this.fingers[f];
      const fmcp = this.getMcpPos(f);
      const act  = s.active[f];
      const pl   = s.planted[f];
      const up   = s.upcoming[f];
      let targetX, targetY, role, fret = 0, strings = [];

      // Chord snap: when entering a new chord group, immediately place every
      // fretted finger to its chord-shape position.  The guitarist holds the
      // full chord before picking individual strings.
      if (cgChanged && cg && cg.fingerTargets[f]) {
        const tgt = cg.fingerTargets[f];
        const snapActive = s.active[f];
        const snapPlanted = s.planted[f];
        const snapUpcoming = s.upcoming[f];
        if (!snapActive && !snapPlanted && snapUpcoming) {
          fg.tipX = fmcp.x + FOLD_X_OFFSET[f];
          fg.tipY = fmcp.y + FOLD_Y_OFFSET[f];
          fg.fret = 0;
          fg.strings = [];
          fg.role = 'idle';
          continue;
        }
        fg.tipX = pressX(tgt.fret);
        fg.tipY = stringY(tgt.string);
        fg.fret = tgt.fret;
        fg.strings = [tgt.string];
        fg.role = snapActive ? 'active' : snapPlanted ? 'planted' : 'idle';
        if (s.recent[f] !== undefined) fg.lastOnset = s.recent[f];
        continue; // already placed — skip normal lerp this frame
      }

      if (act) {
        fret    = act.fret;
        strings = act.strings || [act.string];
        targetX = pressX(fret);
        // If barring multiple strings, target the geometric centre so the
        // finger stays put across the barre instead of sliding between strings.
        const ymin = stringY(strings[0]);
        const ymax = stringY(strings[strings.length - 1]);
        targetY = (ymin + ymax) / 2;
        role = "active";
      } else if (pl) {
        fret    = pl.fret;
        strings = pl.strings || [pl.string];
        targetX = pressX(fret);
        const ymin = stringY(strings[0]);
        const ymax = stringY(strings[strings.length - 1]);
        targetY = (ymin + ymax) / 2;
        role = "planted";
      } else if (up) {
        targetX = fmcp.x + FOLD_X_OFFSET[f];
        targetY = fmcp.y + FOLD_Y_OFFSET[f];
        role = "idle";
      } else {
        targetX = fmcp.x + FOLD_X_OFFSET[f];
        targetY = fmcp.y + FOLD_Y_OFFSET[f];
        role = "idle";
      }
      // Faster approach when actively striking; slower for idle. Barring
      // transitions between adjacent strings at the same fret are smoothed
      // by the centre-targeting (palm/MCP stays put, tip is already in the
      // middle of the bar so there is no visible slide).
      // Idle fingers snap with the palm on small shifts (≤2 frets) to prevent
      // them from lagging behind and appearing over-extended.
      const tau = role === "active" ? 0.05
                : role === "planted" ? 0.06
                : role === "hover" ? 0.08
                : hpDelta <= 2 ? 0.025 : 0.11;
      fg.tipX += (targetX - fg.tipX) * Math.min(1, dt / tau);
      fg.tipY += (targetY - fg.tipY) * Math.min(1, dt / tau);
      fg.role    = role;
      fg.fret    = fret;
      fg.strings = strings;
      if (s.recent[f] !== undefined) fg.lastOnset = s.recent[f];
    }

    // Enforce anatomical constraint: fingers cannot cross.
    // After smoothing, clamp so index ≤ middle ≤ ring ≤ pinky in X, with a
    // small gap.  This prevents impossible under-crossings during fast shifts.
    let maxTipX = -Infinity;
    for (const f of FINGER_ORDER) {
      if (this.fingers[f].tipX < maxTipX + 5) this.fingers[f].tipX = maxTipX + 5;
      maxTipX = this.fingers[f].tipX;
    }
  }
}

/* ---------- SVG helpers --------------------------------------------------- */
function el(tag, attrs, text) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = String(text);
  return e;
}
function clearLayer(layer) { while (layer.firstChild) layer.removeChild(layer.firstChild); }

/* ---------- Fretboard rendering ------------------------------------------ */
function buildFretboard(layer, data) {
  clearLayer(layer);
  const x0 = NUT_X - 18, x1 = fretX(NUM_FRETS) + 10;
  const boardTop = BOARD_TOP_Y;
  const boardBot = STRING_Y_BOTTOM + BOARD_TOP_MARGIN;

  layer.appendChild(el("rect", {
    x: x0 - 6, y: boardTop - 6, width: (x1 - x0) + 12, height: (boardBot - boardTop) + 12,
    rx: 10, ry: 10, fill: "#0c0c0d", stroke: "#2b2d32", "stroke-width": 1,
  }));
  layer.appendChild(el("rect", {
    x: x0, y: boardTop, width: x1 - x0, height: boardBot - boardTop,
    rx: 6, ry: 6, fill: "url(#boardGrad)",
  }));
  const singleDots = [3, 5, 7, 9, 15].filter(f => f <= NUM_FRETS);
  for (const f of singleDots) {
    const cx = (fretX(f - 1) + fretX(f)) / 2;
    layer.appendChild(el("circle", {
      cx, cy: (boardTop + boardBot) / 2, r: 9,
      fill: "#ffffff", "fill-opacity": 0.85,
    }));
  }
  if (NUM_FRETS >= 12) {
    const cx  = (fretX(11) + fretX(12)) / 2;
    const mid = (boardTop + boardBot) / 2;
    layer.appendChild(el("circle", { cx, cy: mid - 20, r: 9, fill: "#fff", "fill-opacity": 0.85 }));
    layer.appendChild(el("circle", { cx, cy: mid + 20, r: 9, fill: "#fff", "fill-opacity": 0.85 }));
  }
  layer.appendChild(el("rect", {
    x: NUT_X - 8, y: boardTop, width: 10, height: boardBot - boardTop,
    fill: "url(#nutGrad)", stroke: "#5a5234", "stroke-width": 0.5,
  }));
  for (let f = 1; f <= NUM_FRETS; f++) {
    layer.appendChild(el("rect", {
      x: fretX(f) - 1.8, y: boardTop - 2, width: 3.6, height: (boardBot - boardTop) + 4,
      fill: "url(#fretWire)", rx: 1.2,
    }));
  }
  for (let f = 1; f <= NUM_FRETS; f++) {
    const cx = (fretX(f - 1) + fretX(f)) / 2;
    layer.appendChild(el("text", {
      x: cx, y: boardBot + 22, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif", "font-size": 11, fill: "#6d7178",
    }, f));
  }
  // String gauges taper from thick (low/bass) to thin (high/treble).  The
  // lowest ~half are rendered wound (bronze), the upper half plain (silver).
  // Indexed by string number s (1 = highest/thinnest .. NUM_STRINGS = lowest).
  for (let s = NUM_STRINGS; s >= 1; s--) {
    const y = stringY(s);
    // tFromHigh: 0 at the highest string, 1 at the lowest.
    const tFromHigh = NUM_STRINGS > 1 ? (s - 1) / (NUM_STRINGS - 1) : 0;
    const thickness = 1.3 + tFromHigh * (3.2 - 1.3);
    const wound = s > NUM_STRINGS / 2;   // lower half = wound (bronze)
    layer.appendChild(el("rect", {
      x: NUT_X - 6, y: y - thickness / 2,
      width: x1 - NUT_X + 6, height: thickness,
      fill: "url(#" + (wound ? "stringWound" : "stringPlain") + ")", rx: 0.8,
    }));
  }
  // tuning lists open strings low→high; in this layout s=1 is at top (highest)
  // and s=NUM_STRINGS at bottom (lowest), so the label for string s comes from
  // tuning[NUM_STRINGS - s].  Fall back to deriving it from STRING_MIDI_BASE.
  const tuning = (data && data.fretboard && Array.isArray(data.fretboard.tuning)
                  && data.fretboard.tuning.length === NUM_STRINGS)
    ? data.fretboard.tuning
    : null;
  for (let s = 1; s <= NUM_STRINGS; s++) {
    const label = tuning
      ? tuning[NUM_STRINGS - s]
      : _midiToNoteLabel(STRING_MIDI_BASE[s - 1] + CAPO_FRET);
    layer.appendChild(el("text", {
      x: NUT_X - 26, y: stringY(s) + 4, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif", "font-size": 12,
      "font-weight": 600, fill: "#c6cad1",
    }, label));
  }
}

/** MIDI pitch → note-name+octave label (e.g. 40 → "E2"). */
function _midiToNoteLabel(midi) {
  const NAMES = ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
  return NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}

/* ---------- Capsule (rounded tapered link) -------------------------------- */
function capsule(a, b, wA, wB, fillRef, strokeCol) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 0.001;
  const nx = -dy / len, ny = dx / len;
  const Ax = a.x + nx * wA / 2, Ay = a.y + ny * wA / 2;
  const Bx = b.x + nx * wB / 2, By = b.y + ny * wB / 2;
  const Cx = b.x - nx * wB / 2, Cy = b.y - ny * wB / 2;
  const Dx = a.x - nx * wA / 2, Dy = a.y - ny * wA / 2;
  const r1 = wA / 2, r2 = wB / 2;
  const path = `M${Ax},${Ay} L${Bx},${By}
                A${r2},${r2} 0 0 1 ${Cx},${Cy}
                L${Dx},${Dy}
                A${r1},${r1} 0 0 1 ${Ax},${Ay} Z`;
  return el("path", {
    d: path, fill: fillRef || "url(#skinGrad)",
    stroke: "none",
  });
}

function fingerShape(ik, w, fillRef) {
  /* Articulated finger: THREE rigid tapered links (proximal mcp→pip, middle
     pip→dip, distal dip→tip) drawn as straight capsules, joined by small filled
     knuckle pivots at the MCP/PIP/DIP joints.  No more single rubber-hose
     Bézier through the control points, and no per-finger root "spike": the
     palm is drawn BEFORE the fingers (see drawHand) and overlaps the proximal
     link at the MCP, so the root tucks under the shared palm edge naturally. */
  const g = el("g", {});
  // Per-segment width taper: knuckle end slightly wider than the joint above it,
  // tapering toward the fingertip.  Widths are at the proximal/distal ends of
  // each link so adjacent capsules meet flush at the shared joint width.
  const wMcp = w * 1.06;
  const wPip = w * 0.96;
  const wDip = w * 0.84;
  const wTip = w * 0.60;
  // Proximal phalanx (MCP → PIP), middle (PIP → DIP), distal (DIP → tip).
  g.appendChild(capsule(ik.mcp, ik.pip, wMcp, wPip, fillRef));
  g.appendChild(capsule(ik.pip, ik.dip, wPip, wDip, fillRef));
  g.appendChild(capsule(ik.dip, ik.tip, wDip, wTip, fillRef));
  // Filled knuckle pivots so the rigid links read as hinged joints, not gaps.
  for (const [pt, r] of [[ik.mcp, wMcp / 2], [ik.pip, wPip / 2], [ik.dip, wDip / 2]]) {
    g.appendChild(el("circle", {
      cx: pt.x.toFixed(2), cy: pt.y.toFixed(2), r: r.toFixed(2),
      fill: fillRef, stroke: "none",
    }));
  }
  return g;
}

function drawThumb(layer, thumb) {
  const rx = thumb.role === "open" ? 18 : 16;
  const ry = thumb.role === "barre" ? 6 : 7;
  const x = thumb.x;
  const y = thumb.y;
  layer.appendChild(el("ellipse", {
    cx: x, cy: y, rx, ry,
    fill: "rgba(238,190,154,0.82)",
    stroke: "rgba(170,120,95,0.38)", "stroke-width": 1,
  }));
}

/* ---------- Hand rendering (palm above, forearm below the board) ---------- */
function drawHand(layer, shadowLayer, sim, t) {
  clearLayer(layer);
  clearLayer(shadowLayer);

  /* MCP positions derived from wrist pivot rotation. */
  const idxMcp = sim.getMcpPos('index');
  const pnkMcp = sim.getMcpPos('pinky');
  const pivotX = sim.palmX;
  const pivotY = sim.pivotY;
  const θ       = sim.wristRot;
  const cup     = sim.palmCup || 0;

  /* Palm frame, all from the SAME (pivotX, pivotY, θ) transform:
       tangent  (cosθ, sinθ)  — runs ALONG the MCP knuckle row
       normal   (sinθ, −cosθ) — points up away from the fingers, into the palm
     This is the exact frame getMcpPos() uses, so the palm tilts WITH wristRot
     instead of being pinned to a flat horizontal bottom edge. */
  const tPalmX = Math.cos(θ);
  const tPalmY = Math.sin(θ);
  const nPalmX = Math.sin(θ);
  const nPalmY = -Math.cos(θ);

  /* Palm centre and top computed along the perpendicular from the pivot. */
  const palmCX  = pivotX + nPalmX * PALM_CENTER_FROM_MCP;
  const palmCY  = pivotY + nPalmY * (PALM_CENTER_FROM_MCP - cup * 10);
  const palmTopX = pivotX + nPalmX * PALM_TOP_FROM_MCP;
  const palmTopY = pivotY + nPalmY * (PALM_TOP_FROM_MCP - cup * 18);

  /* Wrist and forearm centres derive from the pivot / palm directions. */
  const wristX = palmTopX + sim.forearmDrift * 0.3;
  const forearmX = palmTopX + sim.forearmDrift;

  /* Half-width measured along the knuckle TANGENT between index & pinky MCPs
     (their separation is the metacarpal spread), plus an overhang margin so the
     palm laps over the outer finger roots. */
  const mcpSpan = Math.hypot(pnkMcp.x - idxMcp.x, pnkMcp.y - idxMcp.y);
  const palmHalfW = mcpSpan / 2 + 12 - cup * 8;

  /* Forearm — long taper from the bottom of scene toward the neck.
     Stops just below the board; the wrist is conceptually hidden behind it. */
  layer.appendChild(el("path", {
    d: `M${forearmX - 78},${SCENE_H + 40}
        Q${forearmX - 70},${SCENE_H - 56} ${wristX - 54},${FOREARM_TOP_Y + 2}
        L${wristX + 54},${FOREARM_TOP_Y + 2}
        Q${forearmX + 70},${SCENE_H - 56} ${forearmX + 78},${SCENE_H + 40}
        Z`,
    fill: "url(#skinGrad)", stroke: "rgba(170,120,95,0.55)", "stroke-width": 1.5,
  }));

  drawThumb(layer, sim.thumb);

  /* Ghost stripe through the neck */
  const ghostW = 48;
  layer.appendChild(el("rect", {
    x: wristX - ghostW / 2,
    y: BOARD_TOP_Y - 2,
    width: ghostW,
    height: (BOARD_BOT_Y - BOARD_TOP_Y) + 4,
    fill: "rgba(230,188,160,0.09)",
    stroke: "rgba(170,120,95,0.22)",
    "stroke-width": 0.8,
    "stroke-dasharray": "4 3",
    rx: 6,
  }));

  /* Pre-solve all finger IK before drawing the palm so the palm bottom can
     extend far enough to keep all finger roots visually inside the palm.
     (MCPs are fixed to the palm — only the palm pivot moves as a unit.) */
  const _preIK = {};
  for (const _fn of FINGER_ORDER) {
    const _mcp = sim.getMcpPos(_fn);
    const _fg  = sim.fingers[_fn];
    _preIK[_fn] = solveFinger(_mcp.x, _mcp.y, _fg.tipX, _fg.tipY, _fn, _fg.role);
  }
  /* Palm (ABOVE the neck): a quad whose BOTTOM EDGE runs along the real MCP
     knuckle row.  Both bottom corners sit on the rotated knuckle line (so the
     edge tilts with wristRot), pushed a few px PAST index/pinky along the
     tangent (overhang) and a small step DOWN the palm normal so the knuckles
     tuck just under the edge — the fingers, drawn after this, then emerge from
     within the palm with no floating spike.  The pivot is the knuckle-row
     midpoint, keeping the bottom edge bound to the same frame as the top. */
  const knuckleMidX = (idxMcp.x + pnkMcp.x) / 2;
  const knuckleMidY = (idxMcp.y + pnkMcp.y) / 2;
  const overhang = 12;                 // px past the outer MCP along the row
  const belowKnuckles = 8;             // px past the knuckle line toward the fingers
  // Bottom corners: knuckle-row midpoint ± (halfW+overhang) along the tangent,
  // stepped a little PAST the knuckles toward the fingers (along −normal) so the
  // edge laps over the finger roots and the MCPs sit inside the palm body.
  const blX = knuckleMidX - tPalmX * (palmHalfW + overhang) - nPalmX * belowKnuckles;
  const blY = knuckleMidY - tPalmY * (palmHalfW + overhang) - nPalmY * belowKnuckles;
  const brX = knuckleMidX + tPalmX * (palmHalfW + overhang) - nPalmX * belowKnuckles;
  const brY = knuckleMidY + tPalmY * (palmHalfW + overhang) - nPalmY * belowKnuckles;
  // Upper side guides + rounded top, all from the same (center/top, normal,
  // tangent) frame so the silhouette is one coherent transform.
  const ulX = palmCX - tPalmX * (palmHalfW + 10);
  const ulY = palmCY - tPalmY * (palmHalfW + 10);
  const urX = palmCX + tPalmX * (palmHalfW + 10);
  const urY = palmCY + tPalmY * (palmHalfW + 10);
  const topLX = palmTopX - tPalmX * (palmHalfW - 8) + nPalmX * 0;
  const topLY = palmTopY - tPalmY * (palmHalfW - 8) + nPalmY * 0;
  const topRX = palmTopX + tPalmX * (palmHalfW - 8);
  const topRY = palmTopY + tPalmY * (palmHalfW - 8);
  layer.appendChild(el("path", {
    d: `M${blX.toFixed(2)},${blY.toFixed(2)}
        Q${ulX.toFixed(2)},${ulY.toFixed(2)} ${topLX.toFixed(2)},${topLY.toFixed(2)}
        Q${palmTopX.toFixed(2)},${palmTopY.toFixed(2)} ${topRX.toFixed(2)},${topRY.toFixed(2)}
        Q${urX.toFixed(2)},${urY.toFixed(2)} ${brX.toFixed(2)},${brY.toFixed(2)}
        Z`,
    fill: "url(#skinGrad)", stroke: "rgba(170,120,95,0.55)", "stroke-width": 1.5,
  }));

  /* Painting rules: all fingers are solid and readable. No transparency and
     no visible articulation markers. */
  const ROLE = {
    active:  { ring: "#ffb347", ringFill: "#ffcf74",
               bodyFill: "url(#skinGrad)", bodyStroke: "rgba(170,120,95,0.72)",
               barFill: "#ffc365", barStroke: "#ffb347",
               nailFill: "#fff7ef", nailStroke: "none", textColor: "#3a241c",
               opacity: 1.0 },
    planted: { ring: "#55d8ff", ringFill: "#a7ecff",
               bodyFill: "#8de5ff", bodyStroke: "#55d8ff",
               barFill: "#8de5ff", barStroke: "#55d8ff",
               nailFill: "#eafaff", nailStroke: "none", textColor: "#082c36",
               opacity: 1.0 },
    hover:   { ring: "#ff756b", ringFill: "#ffc0b9",
               bodyFill: "#ff8d80", bodyStroke: "#ff756b",
               barFill: "none", barStroke: "none",
               nailFill: "#ffe4df", nailStroke: "none", textColor: "#4f120e",
               opacity: 1.0 },
    idle:    { ring: "#ff9b3d", ringFill: "#ffc07a",
               bodyFill: "#ff9b3d", bodyStroke: "#ff9b3d",
               barFill: "none",  barStroke: "none",
               nailFill: "#ffe0bf", nailStroke: "none",
               textColor: "#3b1800", opacity: 1.0 },
  };

  /* Draw each finger — use the pre-solved IKs from fixed MCP anchors. */
  for (const fname of FINGER_ORDER) {
    const fg   = sim.fingers[fname];
    const ik   = _preIK[fname];
    const w    = fingerPxWidth(fname, fg.fret);
    const role = fg.role;
    const pal  = ROLE[role];

    const fillRef = pal.bodyFill;

    /* Barre rendering: when the finger covers >=2 adjacent strings at the
       same fret, draw a vertical bar pad at that fret.  Drawn BEFORE the
       finger body so the tip sits on top. */
    if ((role === "active" || role === "planted") && fg.strings.length > 1) {
      const fx = pressX(fg.fret);
      const ymin = stringY(fg.strings[0]) - 5;
      const ymax = stringY(fg.strings[fg.strings.length - 1]) + 5;
      layer.appendChild(el("rect", {
        x: fx - 9, y: ymin, width: 18, height: ymax - ymin,
        rx: 9, ry: 9,
        fill: pal.barFill, stroke: "none",
      }));
    }

    const gFinger = el("g", { opacity: 1 });
    gFinger.appendChild(fingerShape(ik, w, fillRef));
    layer.appendChild(gFinger);

    /* Fingernail: solid oval, no dark outline. */
    const nailAngle = angleDeg(ik.dip, ik.tip);
    layer.appendChild(el("ellipse", {
      cx: ik.tip.x, cy: ik.tip.y,
      rx: NAIL_RADIUS[fname] * 1.12,
      ry: NAIL_RADIUS[fname] * 0.78,
      transform: `rotate(${nailAngle.toFixed(2)} ${ik.tip.x.toFixed(2)} ${ik.tip.y.toFixed(2)})`,
      fill: pal.nailFill,
      stroke: "none",
    }));
    layer.appendChild(el("ellipse", {
      cx: ik.tip.x - 2, cy: ik.tip.y - 2,
      rx: NAIL_RADIUS[fname] * 0.36,
      ry: NAIL_RADIUS[fname] * 0.18,
      transform: `rotate(${nailAngle.toFixed(2)} ${ik.tip.x.toFixed(2)} ${ik.tip.y.toFixed(2)})`,
      fill: "#ffffff",
      stroke: "none",
    }));
    layer.appendChild(el("text", {
      x: ik.tip.x, y: ik.tip.y + 5, "text-anchor": "middle",
      "font-family": "Helvetica, Arial, sans-serif",
      "font-size": 14, "font-weight": 800,
      fill: pal.textColor,
    }, FINGER_LABEL[fname]));

    /* Note-on explosion: 3-ring amber burst at the fret contact point.
       Drawn AFTER nail+label so it appears on top of everything.
       Uses ik.tip (string contact) so the ring bursts right where the note plays. */
    if (role === "active") {
      const sincePress = t - fg.lastOnset;
      if (sincePress >= 0 && sincePress < 0.45) {
        const k = 1 - sincePress / 0.45;
        /* Outer fast-expanding ring */
        layer.appendChild(el("circle", {
          cx: ik.tip.x, cy: ik.tip.y,
          r: (10 + 38 * (1 - k)).toFixed(1),
          fill: "none",
          stroke: `rgba(255,220,30,${(0.92 * k).toFixed(3)})`,
          "stroke-width": (3.5 * k).toFixed(2),
        }));
        /* Middle ring, slightly delayed */
        if (sincePress < 0.30) {
          const k2 = 1 - sincePress / 0.30;
          layer.appendChild(el("circle", {
            cx: ik.tip.x, cy: ik.tip.y,
            r: (6 + 20 * (1 - k2)).toFixed(1),
            fill: "none",
            stroke: `rgba(255,255,120,${(0.80 * k2).toFixed(3)})`,
            "stroke-width": (2.5 * k2).toFixed(2),
          }));
        }
        /* Inner glow fill — concentrated flash */
        layer.appendChild(el("circle", {
          cx: ik.tip.x, cy: ik.tip.y,
          r: (4 + 10 * (1 - k)).toFixed(1),
          fill: `rgba(255,255,180,${(0.70 * k).toFixed(3)})`,
          stroke: "none",
        }));
      }
    }
  }
}
