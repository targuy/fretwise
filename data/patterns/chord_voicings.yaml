# Guitar Chord Voicings Library
#
# Format: each chord has a name and one preferred voicing.
# frets: [high_e (str 1), B (str 2), G (str 3), D (str 4), A (str 5), low_E (str 6)]
# -1 = muted (X), 0 = open (O)
# fingers: [0=no fingering, 1=index, 2=middle, 3=ring, 4=pinky] — same indexing as frets
# base_fret: 1 for open-position chords, higher for barre chords up the neck
#
# Verification key: standard tab notation is [low_E, A, D, G, B, high_e].
# To convert tab notation XYZWVU to our format: [U, V, W, X, Y, Z] (reversed).
# Example: Am = x02210 (tab) → frets=[0,1,2,2,0,-1] (our format) ✓
#
# The first (and usually only) voicing listed is the most common open-position shape.

chords:

  # ── Major triads ──────────────────────────────────────────────────────────
  # Tab notation shown in comment: [low_E, A, D, G, B, e]

  - name: C          # x32010
    frets: [0, 1, 0, 2, 3, -1]
    fingers: [0, 1, 0, 2, 3, 0]
    base_fret: 1

  - name: D          # xx0232
    frets: [2, 3, 2, 0, -1, -1]
    fingers: [2, 4, 1, 0, 0, 0]
    base_fret: 1

  - name: E          # 022100
    frets: [0, 0, 1, 2, 2, 0]
    fingers: [0, 0, 1, 3, 2, 0]
    base_fret: 1

  - name: F          # 133211
    frets: [1, 1, 2, 3, 3, 1]
    fingers: [1, 1, 2, 4, 3, 1]
    base_fret: 1

  - name: G          # 320003
    frets: [3, 0, 0, 0, 2, 3]
    fingers: [3, 0, 0, 0, 1, 4]
    base_fret: 1

  - name: A          # x02220
    frets: [0, 2, 2, 2, 0, -1]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: B          # x24442
    frets: [2, 4, 4, 4, 2, -1]
    fingers: [1, 3, 4, 4, 1, 0]
    base_fret: 1

  # ── Minor triads ──────────────────────────────────────────────────────────

  - name: Am         # x02210
    frets: [0, 1, 2, 2, 0, -1]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: Bm         # x24432
    frets: [2, 3, 4, 4, 2, -1]
    fingers: [1, 2, 3, 4, 1, 0]
    base_fret: 1

  - name: Cm         # x35543
    frets: [3, 4, 5, 5, 3, -1]
    fingers: [1, 2, 3, 4, 1, 0]
    base_fret: 1

  - name: Dm         # xx0231
    frets: [1, 3, 2, 0, -1, -1]
    fingers: [1, 4, 2, 0, 0, 0]
    base_fret: 1

  - name: Em         # 022000
    frets: [0, 0, 0, 2, 2, 0]
    fingers: [0, 0, 0, 2, 1, 0]
    base_fret: 1

  - name: Fm         # 133111
    frets: [1, 1, 1, 3, 3, 1]
    fingers: [1, 1, 1, 3, 4, 1]
    base_fret: 1

  - name: Gm         # 355333
    frets: [3, 3, 3, 5, 5, 3]
    fingers: [1, 1, 1, 3, 4, 1]
    base_fret: 1

  # ── Dominant 7th ──────────────────────────────────────────────────────────

  - name: A7         # x02020
    frets: [0, 2, 0, 2, 0, -1]
    fingers: [0, 2, 0, 1, 0, 0]
    base_fret: 1

  - name: B7         # x21202
    frets: [2, 0, 2, 1, 2, -1]
    fingers: [4, 0, 3, 1, 2, 0]
    base_fret: 1

  - name: C7         # x32310
    frets: [0, 1, 3, 2, 3, -1]
    fingers: [0, 1, 4, 2, 3, 0]
    base_fret: 1

  - name: D7         # xx0212
    frets: [2, 1, 2, 0, -1, -1]
    fingers: [3, 1, 2, 0, 0, 0]
    base_fret: 1

  - name: E7         # 020100
    frets: [0, 0, 1, 0, 2, 0]
    fingers: [0, 0, 1, 0, 2, 0]
    base_fret: 1

  - name: G7         # 320001
    frets: [1, 0, 0, 0, 2, 3]
    fingers: [1, 0, 0, 0, 2, 3]
    base_fret: 1

  # ── Minor 7th ─────────────────────────────────────────────────────────────

  - name: Am7        # x02010
    frets: [0, 1, 0, 2, 0, -1]
    fingers: [0, 1, 0, 2, 0, 0]
    base_fret: 1

  - name: Bm7        # x24232
    frets: [2, 3, 2, 4, 2, -1]
    fingers: [1, 2, 1, 3, 1, 0]
    base_fret: 1

  - name: Dm7        # xx0211
    frets: [1, 1, 2, 0, -1, -1]
    fingers: [1, 2, 3, 0, 0, 0]
    base_fret: 1

  - name: Em7        # 020000
    frets: [0, 0, 0, 0, 2, 0]
    fingers: [0, 0, 0, 0, 1, 0]
    base_fret: 1

  # ── Major 7th ─────────────────────────────────────────────────────────────

  - name: Amaj7      # x02120
    frets: [0, 2, 1, 2, 0, -1]
    fingers: [0, 3, 1, 2, 0, 0]
    base_fret: 1

  - name: Cmaj7      # x32000
    frets: [0, 0, 0, 2, 3, -1]
    fingers: [0, 0, 0, 1, 2, 0]
    base_fret: 1

  - name: Dmaj7      # xx0222
    frets: [2, 2, 2, 0, -1, -1]
    fingers: [2, 3, 4, 0, 0, 0]
    base_fret: 1

  - name: Emaj7      # 021100
    frets: [0, 0, 1, 1, 2, 0]
    fingers: [0, 0, 1, 2, 3, 0]
    base_fret: 1

  - name: Fmaj7      # xx3210
    frets: [0, 1, 2, 3, -1, -1]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: Gmaj7      # 320002
    frets: [2, 0, 0, 0, 2, 3]
    fingers: [2, 0, 0, 0, 1, 3]
    base_fret: 1

  # ── Minor major 7th ───────────────────────────────────────────────────────

  - name: AmM7       # x02110
    frets: [0, 1, 1, 2, 0, -1]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  # ── Suspended ─────────────────────────────────────────────────────────────

  - name: Asus2      # x02200
    frets: [0, 0, 2, 2, 0, -1]
    fingers: [0, 0, 1, 2, 0, 0]
    base_fret: 1

  - name: Asus4      # x02230
    frets: [0, 3, 2, 2, 0, -1]
    fingers: [0, 4, 2, 1, 0, 0]
    base_fret: 1

  - name: Dsus2      # xx0230
    frets: [0, 3, 2, 0, -1, -1]
    fingers: [0, 3, 1, 0, 0, 0]
    base_fret: 1

  - name: Dsus4      # xx0233
    frets: [3, 3, 2, 0, -1, -1]
    fingers: [3, 4, 2, 0, 0, 0]
    base_fret: 1

  - name: Esus4      # 022200
    frets: [0, 0, 2, 2, 2, 0]
    fingers: [0, 0, 1, 2, 3, 0]
    base_fret: 1

  - name: Gsus4      # 3x0013
    frets: [3, 1, 0, 0, -1, 3]
    fingers: [4, 1, 0, 0, 0, 3]
    base_fret: 1

  # ── Added 9 ───────────────────────────────────────────────────────────────

  - name: Cadd9      # x32033
    frets: [3, 3, 0, 2, 3, -1]
    fingers: [3, 4, 0, 1, 2, 0]
    base_fret: 1

  - name: Dadd9      # xx0252 (D A F# E — keeps both the 3rd and the 9th)
    frets: [2, 5, 2, 0, -1, -1]
    fingers: [1, 4, 2, 0, 0, 0]
    base_fret: 1

  - name: Gadd9      # 300003 (G B D A — keeps the 9th on the open A string)
    frets: [3, 0, 0, 0, 0, 3]
    fingers: [3, 0, 0, 0, 0, 4]
    base_fret: 1

  # ── Sixth chords ──────────────────────────────────────────────────────────

  - name: A6         # x02222
    frets: [2, 2, 2, 2, 0, -1]
    fingers: [1, 2, 3, 4, 0, 0]
    base_fret: 1

  - name: Am6        # x02212
    frets: [2, 1, 2, 2, 0, -1]
    fingers: [4, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: D6         # xx0202
    frets: [2, 0, 2, 0, -1, -1]
    fingers: [2, 0, 1, 0, 0, 0]
    base_fret: 1

  - name: E6         # 022120
    frets: [0, 2, 1, 2, 2, 0]
    fingers: [0, 3, 1, 2, 4, 0]
    base_fret: 1

  # ── Power chords ──────────────────────────────────────────────────────────

  - name: E5
    frets: [-1, -1, -1, -1, 2, 0]
    fingers: [0, 0, 0, 0, 2, 0]
    base_fret: 1

  - name: A5
    frets: [-1, -1, -1, 2, 0, -1]
    fingers: [0, 0, 0, 2, 0, 0]
    base_fret: 1

  - name: G5
    frets: [-1, -1, -1, 5, 5, 3]
    fingers: [0, 0, 0, 4, 3, 1]
    base_fret: 1

  # ── Slash chords (common guitar inversions) ───────────────────────────────

  - name: C/G        # 332010
    frets: [0, 1, 0, 2, 3, 3]
    fingers: [0, 1, 0, 2, 3, 4]
    base_fret: 1

  - name: C/E        # 032010
    frets: [0, 1, 0, 2, 3, 0]
    fingers: [0, 1, 0, 2, 3, 0]
    base_fret: 1

  - name: D/F#       # 200232
    frets: [2, 3, 2, 0, 0, 2]
    fingers: [2, 4, 1, 0, 0, 2]
    base_fret: 1

  - name: E/G#       # 422100
    frets: [0, 0, 1, 2, 2, 4]
    fingers: [0, 0, 1, 2, 3, 4]
    base_fret: 1

  - name: G/B        # x20003
    frets: [3, 0, 0, 0, 2, -1]
    fingers: [4, 0, 0, 0, 1, 0]
    base_fret: 1

  - name: G/D        # xx0033
    frets: [3, 3, 0, 0, -1, -1]
    fingers: [3, 4, 0, 0, 0, 0]
    base_fret: 1

  - name: Am/G       # 302210
    frets: [0, 1, 2, 2, 0, 3]
    fingers: [0, 1, 2, 3, 0, 4]
    base_fret: 1

  - name: Am/E       # 002210
    frets: [0, 1, 2, 2, 0, 0]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: Em/D       # xx0000
    frets: [0, 0, 0, 0, -1, -1]
    fingers: [0, 0, 0, 0, 0, 0]
    base_fret: 1

  - name: Em/B       # x22000
    frets: [0, 0, 0, 2, 2, -1]
    fingers: [0, 0, 0, 2, 1, 0]
    base_fret: 1

  - name: F/C        # x33211
    frets: [1, 1, 2, 3, 3, -1]
    fingers: [1, 1, 2, 4, 3, 0]
    base_fret: 1

  - name: A/C#       # x42220
    frets: [0, 2, 2, 2, 4, -1]
    fingers: [0, 1, 2, 3, 4, 0]
    base_fret: 1

  - name: A/E        # 002220
    frets: [0, 2, 2, 2, 0, 0]
    fingers: [0, 1, 2, 3, 0, 0]
    base_fret: 1

  - name: D/A        # x00232
    frets: [2, 3, 2, 0, 0, -1]
    fingers: [1, 3, 2, 0, 0, 0]
    base_fret: 1

  - name: Am7/G      # 302010
    frets: [0, 1, 0, 2, 0, 3]
    fingers: [0, 1, 0, 2, 0, 3]
    base_fret: 1

  # ── Diminished ────────────────────────────────────────────────────────────

  - name: Bdim       # x2343x
    frets: [-1, 3, 4, 3, 2, -1]
    fingers: [0, 2, 4, 3, 1, 0]
    base_fret: 1

  - name: C#dim      # x46564 → triad C# E G (the x4545x form was a dim7)
    frets: [-1, 5, 6, 5, 4, -1]
    fingers: [0, 2, 4, 3, 1, 0]
    base_fret: 1

  # ── Augmented ─────────────────────────────────────────────────────────────

  - name: Caug       # x32110
    frets: [0, 1, 1, 2, 3, -1]
    fingers: [0, 1, 2, 3, 4, 0]
    base_fret: 1

  - name: Eaug       # 032110
    frets: [0, 1, 1, 2, 3, 0]
    fingers: [0, 1, 2, 3, 4, 0]
    base_fret: 1

  # ── Ninth chords ──────────────────────────────────────────────────────────

  - name: G9         # 3x0201
    frets: [1, 0, 2, 0, -1, 3]
    fingers: [1, 0, 3, 0, 0, 4]
    base_fret: 1

  - name: A9         # x02423
    frets: [3, 2, 4, 2, 0, -1]
    fingers: [3, 1, 4, 2, 0, 0]
    base_fret: 1

  - name: E9         # 020102
    frets: [2, 0, 1, 0, 2, 0]
    fingers: [3, 0, 1, 0, 2, 0]
    base_fret: 1

  # ── Barre chord shapes (common moveable forms) ───────────────────────────

  - name: F#         # 244322
    frets: [2, 2, 3, 4, 4, 2]
    fingers: [1, 1, 2, 4, 3, 1]
    base_fret: 2

  - name: F#m        # 244222
    frets: [2, 2, 2, 4, 4, 2]
    fingers: [1, 1, 1, 3, 4, 1]
