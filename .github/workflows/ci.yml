name: CI

on:
  push:
    branches:
      - master
      - develop
      - "refactor/*"
      - "feature/*"
      - "fix/*"
      - "claude/*"
  pull_request:
    branches:
      - master
      - develop
      - "refactor/*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,cloud,auth]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/fretwise --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest --cov=fretwise --cov-report=xml --tb=short -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        if: matrix.python-version == '3.11'

  # -------------------------------------------------------------------------
  # P0 notation fixes — targeted validation job
  # Runs on the refactor/p0-notation-fixes branch and any PR targeting master.
  # -------------------------------------------------------------------------
  p0-validation:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/refactor/p0-notation-fixes' ||
      startsWith(github.ref, 'refs/heads/refactor/') ||
      github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,cloud,auth]"

      # -- P0-B: pitch_to_staff_y --
      - name: "[P0-B] Lint core/layout/rules.py"
        run: |
          if [ -f src/fretwise/core/layout/rules.py ]; then
            ruff check src/fretwise/core/layout/rules.py --select E,W,F
          else
            echo "src/fretwise/core/layout/rules.py not present yet — skipping"
          fi

      - name: "[P0-B] Type-check core/layout/rules.py"
        run: |
          if [ -f src/fretwise/core/layout/rules.py ]; then
            mypy src/fretwise/core/layout/rules.py --ignore-missing-imports
          else
            echo "src/fretwise/core/layout/rules.py not present yet — skipping"
          fi

      - name: "[P0-B] Run pitch_to_staff tests"
        run: |
          if [ -f tests/test_p0b_pitch_to_staff.py ]; then
            pytest tests/test_p0b_pitch_to_staff.py -v --tb=short
          else
            echo "tests/test_p0b_pitch_to_staff.py not yet present — OK"
          fi

      # -- P0-C: per-measure time signatures --
      - name: "[P0-C] Lint core/canonical/mappers.py + core/ingest/models.py"
        run: |
          FILES=""
          [ -f src/fretwise/core/canonical/mappers.py ] && FILES="$FILES src/fretwise/core/canonical/mappers.py"
          [ -f src/fretwise/core/ingest/models.py ]     && FILES="$FILES src/fretwise/core/ingest/models.py"
          if [ -n "$FILES" ]; then
            ruff check $FILES --select E,W,F
          else
            echo "P0-C source files not present yet — skipping"
          fi

      - name: "[P0-C] Type-check core/canonical/mappers.py"
        run: |
          if [ -f src/fretwise/core/canonical/mappers.py ]; then
            mypy src/fretwise/core/canonical/mappers.py --ignore-missing-imports
          else
            echo "src/fretwise/core/canonical/mappers.py not present yet — skipping"
          fi

      - name: "[P0-C] Run per-measure timesig tests"
        run: |
          if [ -f tests/test_p0c_per_measure_timesig.py ]; then
            pytest tests/test_p0c_per_measure_timesig.py -v --tb=short
          else
            echo "tests/test_p0c_per_measure_timesig.py not yet present — OK"
          fi

      # -- Core regression guard --
      - name: "Core layout + canonical regression tests"
        run: |
          TESTS=""
          [ -f tests/test_core_canonical.py ]     && TESTS="$TESTS tests/test_core_canonical.py"
          [ -f tests/test_core_layout.py ]         && TESTS="$TESTS tests/test_core_layout.py"
          [ -f tests/test_core_layout_rules.py ]   && TESTS="$TESTS tests/test_core_layout_rules.py"
          if [ -n "$TESTS" ]; then
            pytest $TESTS -v --tb=short
          else
            echo "No core regression tests found — skipping"
          fi
